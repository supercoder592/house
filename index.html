<title>金邸計畫 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#111318;
    --panel:rgba(17,19,24,.82);
    --line:#32363f;
    --gold:#c9a35c;
    --gold-soft:#8a7347;
    --ivory:#efe9dc;
    --muted:#9a9689;
    --good:#7fb98a;
    --bad:#d97b6c;
  }
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--ivory);
    font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:15px;line-height:1.6;overflow:hidden;
    padding-block:0;padding-inline:0;
  }
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none;-webkit-touch-callout:none}
  body{overscroll-behavior:none}

  /* ── HUD ── */
  .hud{position:fixed;z-index:5;pointer-events:none}
  #stats{
    top:12px;left:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 24px);
  }
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:6px 12px;min-width:96px;backdrop-filter:blur(4px);
  }
  .stat .label{font-size:10px;letter-spacing:.18em;color:var(--muted)}
  .stat .value{
    font-family:"Noto Serif TC",serif;font-weight:900;font-size:17px;
    font-variant-numeric:tabular-nums;color:var(--gold);line-height:1.3;
  }
  .stat .value.debt{color:var(--bad)}
  .stat .value.plain{color:var(--ivory)}
  #monthbar{height:3px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
  #monthbar i{display:block;height:100%;background:var(--gold);width:0%}

  #protbar{top:12px;right:12px;display:flex;gap:6px}
  .prot{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    font-size:18px;opacity:.32;backdrop-filter:blur(4px);
  }
  .prot.on{opacity:1;border-color:var(--gold-soft)}

  #crosshair{
    top:50%;left:50%;transform:translate(-50%,-50%);
    width:18px;height:18px;
  }
  #crosshair::before,#crosshair::after{
    content:"";position:absolute;background:rgba(239,233,220,.85);
  }
  #crosshair::before{left:8px;top:0;width:2px;height:18px}
  #crosshair::after{top:8px;left:0;width:18px;height:2px}

  #logfeed{
    left:12px;bottom:86px;display:flex;flex-direction:column;gap:4px;max-width:min(400px,70vw);
  }
  #logfeed .entry{
    background:var(--panel);border-left:3px solid var(--line);border-radius:0 6px 6px 0;
    padding:3px 10px;font-size:12px;backdrop-filter:blur(4px);
  }
  #logfeed .entry.event{border-left-color:var(--gold)}
  #logfeed .entry.disaster{border-left-color:var(--bad)}
  #logfeed .entry.gain{border-left-color:var(--good)}

  #hotbar{
    bottom:12px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;pointer-events:auto;max-width:calc(100vw - 16px);
    overflow-x:auto;padding:2px;
  }
  .slot{
    background:var(--panel);border:2px solid var(--line);border-radius:8px;
    width:58px;flex:0 0 auto;padding:5px 3px 3px;text-align:center;cursor:pointer;
    backdrop-filter:blur(4px);
  }
  .slot.sel{border-color:var(--gold)}
  .slot .chip{width:22px;height:22px;border-radius:4px;margin:0 auto 2px;border:1px solid rgba(0,0,0,.35)}
  .slot .n{font-size:10px;line-height:1.2;white-space:nowrap}
  .slot .p{font-size:9px;color:var(--gold);font-variant-numeric:tabular-nums}
  .slot .k{position:relative;top:-2px;font-size:8px;color:var(--muted)}

  #btns{right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
  .hbtn{
    background:var(--panel);border:1px solid var(--gold-soft);color:var(--gold);
    border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13px;cursor:pointer;
    backdrop-filter:blur(4px);
  }
  .hbtn:hover{background:var(--gold);color:var(--ink)}
  .hbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ── 觸控 ── */
  #touchui{display:none}
  @media (pointer:coarse){
    #touchui{display:block;pointer-events:none}
    #joy{
      position:fixed;left:14px;bottom:96px;width:104px;height:104px;border-radius:50%;
      border:2px solid rgba(239,233,220,.35);pointer-events:auto;z-index:6;
      touch-action:none;
    }
    #joy i{
      position:absolute;left:50%;top:50%;width:42px;height:42px;border-radius:50%;
      background:rgba(201,163,92,.5);transform:translate(-50%,-50%);
    }
    .tbtn{
      position:fixed;z-index:6;pointer-events:auto;touch-action:none;
      background:var(--panel);border:1px solid var(--gold-soft);color:var(--ivory);
      border-radius:10px;width:56px;height:48px;font-size:13px;font-family:inherit;
      backdrop-filter:blur(4px);
    }
    #t-place{right:12px;bottom:210px;border-color:var(--good)}
    #t-break{right:12px;bottom:156px;border-color:var(--bad)}
    #t-up{right:74px;bottom:210px}
    #t-down{right:74px;bottom:156px}
    #t-rot{right:136px;bottom:210px}

    /* 手機版 HUD 緊湊排版 */
    #stats{top:8px;left:8px;right:8px;gap:6px;flex-wrap:nowrap}
    .stat{padding:4px 8px;min-width:0;flex:1}
    .stat .label{font-size:9px;letter-spacing:.12em}
    .stat .value{font-size:13px}
    #protbar{top:56px;right:8px}
    .prot{width:30px;height:30px;font-size:14px}
    #btns{top:56px;right:auto;left:8px;bottom:auto;flex-direction:row;gap:6px}
    .hbtn{padding:5px 10px;font-size:12px}
    #logfeed{top:100px;left:8px;bottom:auto;max-width:62vw}
    #logfeed .entry{font-size:11px;padding:2px 8px}
    #hotbar{bottom:6px}
    .slot{width:46px;padding:4px 2px 2px}
    .slot .chip{width:17px;height:17px}
    .slot .n{font-size:9px}
    .slot .p{font-size:8px}
    #hint{top:34%;font-size:12px}
  }
  .card{touch-action:pan-y}

  /* ── 卡片與遮罩 ── */
  .overlay{
    position:fixed;inset:0;background:rgba(8,9,12,.78);z-index:20;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{
    background:#1a1d25;border:1px solid var(--gold-soft);border-radius:14px;
    max-width:440px;width:100%;padding:26px;text-align:center;
    max-height:88vh;overflow-y:auto;
  }
  .card.disaster{border-color:var(--bad)}
  .card .big{font-size:50px;line-height:1;margin-bottom:10px}
  .card h3{
    font-family:"Noto Serif TC",serif;font-weight:900;font-size:23px;margin:0 0 8px;
    color:var(--gold);letter-spacing:.1em;text-wrap:balance;
  }
  .card.disaster h3{color:var(--bad)}
  .card p{margin:0 0 6px}
  .card .effect{font-variant-numeric:tabular-nums;font-weight:700;margin-top:8px}
  .card .effect.bad{color:var(--bad)}
  .card .effect.good{color:var(--good)}
  .card button.main{
    margin-top:18px;background:var(--gold);color:var(--ink);border:none;border-radius:8px;
    padding:10px 30px;font-family:"Noto Serif TC",serif;font-weight:600;font-size:15px;
    letter-spacing:.14em;cursor:pointer;
  }
  .card.disaster button.main{background:var(--bad)}
  .card button.alt{
    margin-top:18px;background:transparent;border:1px solid var(--gold-soft);color:var(--gold);
    border-radius:8px;padding:10px 22px;font-family:"Noto Serif TC",serif;font-weight:600;
    font-size:15px;letter-spacing:.1em;cursor:pointer;
  }
  .card button.alt:disabled{opacity:.6;cursor:wait}
  .card button:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}

  /* 防災商店 */
  .shoprow{
    display:flex;align-items:center;gap:10px;text-align:left;
    background:#20242e;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:8px;
  }
  .shoprow .ic{font-size:20px}
  .shoprow .inf{flex:1;min-width:0}
  .shoprow .inf .n{font-weight:700;font-size:14px}
  .shoprow .inf .d{font-size:12px;color:var(--muted)}
  .shoprow button{
    border:1px solid var(--gold-soft);background:transparent;color:var(--gold);border-radius:6px;
    padding:5px 12px;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .shoprow button:disabled{opacity:.4;cursor:not-allowed}
  .shoprow.owned{border-color:var(--gold-soft)}

  /* 開始畫面 */
  #start h1{
    font-family:"Noto Serif TC",serif;font-weight:900;font-size:34px;margin:0 0 2px;
    color:var(--gold);letter-spacing:.1em;
  }
  #start .tag{font-size:12px;letter-spacing:.2em;color:var(--muted);margin-bottom:14px}
  #start table{margin:0 auto;border-collapse:collapse;font-size:13px}
  #start td{padding:2px 10px;text-align:left}
  #start td:first-child{color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
  #start .foot{margin-top:14px;font-size:12px;color:var(--muted)}
  #start a{color:var(--gold)}

  .ending .rank{
    font-family:"Noto Serif TC",serif;font-weight:900;font-size:32px;color:var(--gold);
    margin:6px 0;letter-spacing:.08em;
  }
  .ending table{margin:12px auto 0;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .ending td{padding:3px 12px;font-size:14px;text-align:left}
  .ending td:last-child{text-align:right;color:var(--gold)}

  #flash{
    position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;
    background:radial-gradient(ellipse at 50% 68%, rgba(255,128,40,.5), rgba(255,60,20,.14) 55%, transparent 78%);
  }
  #hint{
    top:14%;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:6px 16px;font-size:13px;backdrop-filter:blur(4px);white-space:nowrap;
  }
</style>

<div id="app"></div>

<div class="hud" id="stats">
  <div class="stat"><div class="label">預算</div><div class="value" id="s-budget">10,000萬</div></div>
  <div class="stat"><div class="label">豪華度</div><div class="value plain" id="s-lux">0</div></div>
  <div class="stat"><div class="label">進度</div><div class="value plain" id="s-month">第 1 月</div>
    <div id="monthbar"><i id="monthfill"></i></div></div>
</div>
<div class="hud" id="protbar">
  <div class="prot" id="p-quake"   title="制震結構">🏗️</div>
  <div class="prot" id="p-typhoon" title="防颱工法">🪟</div>
  <div class="prot" id="p-fire"    title="消防灑水">🧯</div>
  <div class="prot" id="p-flood"   title="排水閘門">🚧</div>
</div>
<div class="hud" id="crosshair"></div>
<div class="hud" id="logfeed"></div>
<div class="hud" id="hotbar"></div>
<div class="hud" id="btns">
  <button class="hbtn" id="btn-shop">防災工程 (B)</button>
  <button class="hbtn" id="btn-skip">跳到下個月 (N)</button>
</div>
<div class="hud" id="hint" hidden></div>

<div id="touchui">
  <div id="joy"><i></i></div>
  <button class="tbtn" id="t-place">放置</button>
  <button class="tbtn" id="t-break">拆除</button>
  <button class="tbtn" id="t-up">上升</button>
  <button class="tbtn" id="t-down">下降</button>
  <button class="tbtn" id="t-rot">旋轉</button>
</div>

<div id="flash"></div>
<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
"use strict";
const W = v => v.toLocaleString("zh-TW") + "萬";
const $ = id => document.getElementById(id);
const IS_TOUCH = matchMedia("(pointer:coarse)").matches;

// ─── 建築構件型錄（cost 單位：萬；尺寸單位：公尺）──────
const TYPES = [
  {id:"wallC", name:"混凝土牆", w:4, h:3,   d:.25, cost:40,  lux:2,  color:0x989da2, tex:"concrete",  rep:[2,1.5]},
  {id:"wallM", name:"大理石牆", w:4, h:3,   d:.25, cost:120, lux:8,  color:0xece6da, tex:"marble",    rep:[2,1.5]},
  {id:"wallW", name:"木質牆",   w:4, h:3,   d:.25, cost:60,  lux:3,  color:0x8a5a33, tex:"wood",      rep:[2,1.5], flammable:true},
  {id:"glass", name:"玻璃帷幕", w:4, h:3,   d:.15, cost:90,  lux:6,  color:0x9fd8ef, tex:"glass",     rep:[2,1.5], transparent:true, fragile:true},
  {id:"door",  name:"大門牆",   w:4, h:3,   d:.25, cost:80,  lux:4,  color:0xb08968, tex:"door",      rep:[1,1],   flammable:true},
  {id:"slab",  name:"樓板",     w:4, h:.3,  d:4,   cost:60,  lux:2,  color:0xb9b3a6, top:"stonefloor", side:"concrete", repTop:[2,2]},
  {id:"roof",  name:"屋頂板",   w:4, h:.35, d:4,   cost:70,  lux:3,  color:0x3a3f4a, top:"roof",       side:"concrete", repTop:[2,2], isRoof:true},
  {id:"col",   name:"石柱",     w:.5,h:3,   d:.5,  cost:25,  lux:1,  color:0xece6da, tex:"marble",    rep:[.5,1.5]},
  {id:"cont",  name:"貨櫃屋",   w:6, h:2.6, d:2.5, cost:150, lux:5,  color:0xc2572e, tex:"container", rep:[3,1.3], metalHull:true},
  {id:"pool",  name:"泳池",     w:4, h:.6,  d:4,   cost:200, lux:10, color:0x3f8fd2, top:"water",      side:"marble",   repTop:[2,2], waterTop:true},
];
const PROTS = [
  {key:"quake",   icon:"🏗️", name:"制震結構", cost:800, desc:"大幅降低地震損失"},
  {key:"typhoon", icon:"🪟", name:"防颱工法", cost:300, desc:"大幅降低颱風損失"},
  {key:"fire",    icon:"🧯", name:"消防灑水", cost:250, desc:"大幅降低火災損失"},
  {key:"flood",   icon:"🚧", name:"排水閘門", cost:350, desc:"大幅降低洪水損失"},
];
const MONTHS = 12, MONTH_SECS = 45, RANGE = 30, MAX_Y = 24;

// ─── 天災與事件 ─────────────────────────────────────
const DISASTERS = [
  {key:"quake",   icon:"🌋", name:"強烈地震", flavor:"芮氏規模 6.8，整片工地劇烈搖晃！",
   pick:u=>true,            frac:.3, cap:8, cash:300, lightCash:50,
   heavyNote:"部分結構崩塌", lightNote:"制震結構發揮作用，僅輕微裂縫"},
  {key:"typhoon", icon:"🌀", name:"超級颱風", flavor:"17 級陣風夾帶豪雨直撲而來！",
   pick:(u,T)=>T.fragile || T.isRoof || u.y>=3, frac:.5, cap:8, cash:200, lightCash:30,
   heavyNote:"玻璃帷幕與屋頂被強風掀落", lightNote:"防颱工法擋下風雨，損失輕微"},
  {key:"fire",    icon:"🔥", name:"電線走火", flavor:"深夜竄出火苗，火勢沿著木造結構蔓延！",
   pick:(u,T)=>T.flammable, frac:.7, cap:8, cash:300, lightCash:40,
   heavyNote:"木造部分付之一炬", lightNote:"灑水系統即時撲滅，虛驚一場"},
  {key:"flood",   icon:"🌊", name:"暴雨洪災", flavor:"時雨量破百毫米，洪水淹進基地！",
   pick:u=>u.y<=.4,         frac:.35, cap:6, cash:250, lightCash:20,
   heavyNote:"一樓與低窪處泡水受損", lightNote:"擋水閘門守住了，僅需清理"},
];
const EVENTS = [
  {icon:"📈", name:"建材大漲",   flavor:"國際原物料飆漲，補付材料差額。", cash:-250},
  {icon:"👷", name:"工班罷工",   flavor:"工班停工爭取加薪，你付了補貼才復工。", cash:-150},
  {icon:"💧", name:"水管爆裂",   flavor:"施工不慎打破主水管，重做管線。", cash:-120},
  {icon:"📢", name:"鄰居抗議",   flavor:"施工噪音引來抗議，你送上禮盒與補償金。", cash:-180},
  {icon:"💰", name:"繼承遺產",   flavor:"遠房親戚留給你一筆意外之財。", cash:500},
  {icon:"📊", name:"股票大賺",   flavor:"持股連拉三根漲停，果斷獲利了結。", cash:350},
  {icon:"🏆", name:"名師操刀",   flavor:"國際建築大師路過驚豔，免費微調設計。", lux:30},
  {icon:"📰", name:"雜誌專訪",   flavor:"居家雜誌以你的宅邸做封面故事。", lux:20, cash:200},
];

// ─── 狀態 ───────────────────────────────────────────
let S, blocks, paused = true, started = false, monthT = 0, shakeT = 0, saveTimer = null;
function freshS(){ return {budget:10000, lux:0, month:1, over:false,
  prot:{quake:false, typhoon:false, fire:false, flood:false}}; }

// ─── Three.js 場景 ──────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151d2c);
scene.fog = new THREE.Fog(0x6e5b47, 55, 165);
const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, .1, 400);
camera.position.set(6, 4, 12);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.6 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$("app").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x93a8c8, 0x40382a, .5));
const sun = new THREE.DirectionalLight(0xf0cf96, 1.15);
sun.position.set(38, 52, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(IS_TOUCH ? 1024 : 2048, IS_TOUCH ? 1024 : 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -42;
sun.shadow.camera.right = sun.shadow.camera.top = 42;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 160;
sun.shadow.bias = -0.0006;
scene.add(sun);

// ─── 程序化寫實材質 ─────────────────────────────────
const R = (a,b)=>a+Math.random()*(b-a);
function makeTex(fn, size=128, repeat=1){
  const c = document.createElement("canvas"); c.width = c.height = size;
  fn(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function speckle(g,s,n,cols,a){
  for(let i=0;i<n;i++){
    g.fillStyle = cols[Math.floor(Math.random()*cols.length)];
    g.globalAlpha = R(a*.4, a);
    g.fillRect(R(0,s), R(0,s), R(1,2.4), R(1,2.4));
  }
  g.globalAlpha = 1;
}
function edge(g,s){
  g.strokeStyle="rgba(0,0,0,.20)"; g.lineWidth=2; g.strokeRect(1,1,s-2,s-2);
  g.strokeStyle="rgba(255,255,255,.07)"; g.lineWidth=1;
  g.beginPath(); g.moveTo(2,2); g.lineTo(s-2,2); g.stroke();
}
const P = {
  concrete(g,s){
    g.fillStyle="#989da2"; g.fillRect(0,0,s,s);
    speckle(g,s,420,["#7d8287","#aab0b5","#6e7276","#c0c5c9"],.5);
    for(let i=0;i<3;i++){
      g.strokeStyle="rgba(55,58,62,.28)"; g.lineWidth=.8;
      g.beginPath(); let x=R(0,s), y=R(0,s); g.moveTo(x,y);
      for(let j=0;j<4;j++){ x+=R(-14,14); y+=R(-14,14); g.lineTo(x,y); } g.stroke();
    }
    edge(g,s);
  },
  marble(g,s){
    g.fillStyle="#ece6da"; g.fillRect(0,0,s,s);
    for(let i=0;i<6;i++){
      g.fillStyle=`rgba(205,195,175,${R(.06,.14)})`;
      g.beginPath(); g.ellipse(R(0,s),R(0,s),R(15,42),R(10,28),R(0,6.3),0,6.3); g.fill();
    }
    for(let i=0;i<7;i++){
      g.strokeStyle=`rgba(112,108,98,${R(.14,.3)})`; g.lineWidth=R(.5,1.6);
      g.beginPath(); let x=R(0,s), y=0; g.moveTo(x,y);
      while(y<s){ y+=R(6,16); x+=R(-9,9); g.lineTo(x,y); } g.stroke();
    }
    edge(g,s);
  },
  wood(g,s){
    g.fillStyle="#6e4522"; g.fillRect(0,0,s,s);
    const pw=s/2;
    for(let p=0;p<2;p++){
      g.fillStyle=`rgb(${128+R(-14,12)|0},${82+R(-10,10)|0},${42+R(-8,8)|0})`;
      g.fillRect(p*pw+1,0,pw-2,s);
      for(let i=0;i<9;i++){
        g.strokeStyle=`rgba(56,32,12,${R(.1,.24)})`; g.lineWidth=1;
        g.beginPath(); let x=p*pw+R(3,pw-3), y=0; g.moveTo(x,0);
        while(y<s){ y+=R(8,20); x=Math.max(p*pw+2,Math.min(p*pw+pw-2,x+R(-1.6,1.6))); g.lineTo(x,y); }
        g.stroke();
      }
      if(Math.random()<.7){ // 木節
        const kx=p*pw+R(6,pw-6), ky=R(10,s-10);
        g.fillStyle="rgba(60,35,14,.55)"; g.beginPath(); g.ellipse(kx,ky,R(2,3.5),R(3,5),0,0,6.3); g.fill();
      }
      g.fillStyle="rgba(38,20,7,.6)"; g.fillRect(p*pw,0,1.5,s); g.fillRect(p*pw+pw-1.5,0,1.5,s);
    }
    edge(g,s);
  },
  brick(g,s){
    g.fillStyle="#b3aa9c"; g.fillRect(0,0,s,s);
    const bh=s/4, bw=s/2;
    for(let r=0;r<4;r++){
      const off = r%2 ? -bw/2 : 0;
      for(let c=0;c<3;c++){
        const x=c*bw+off;
        g.fillStyle=`rgb(${158+R(-26,16)|0},${70+R(-14,12)|0},${56+R(-12,10)|0})`;
        g.fillRect(x+2, r*bh+2, bw-4, bh-4);
        g.fillStyle="rgba(255,255,255,.06)"; g.fillRect(x+2, r*bh+2, bw-4, 2);
      }
    }
    speckle(g,s,160,["#3c2a22","#d9b8a8"],.3);
    edge(g,s);
  },
  glass(g,s){
    g.fillStyle="#cfe6f0"; g.fillRect(0,0,s,s);
    g.strokeStyle="rgba(255,255,255,.35)"; g.lineWidth=7;
    g.beginPath(); g.moveTo(-10,s*.8); g.lineTo(s*.8,-10); g.stroke();
    g.lineWidth=3;
    g.beginPath(); g.moveTo(s*.2,s+10); g.lineTo(s+10,s*.2); g.stroke();
    g.strokeStyle="#5c6a76"; g.lineWidth=6; g.strokeRect(3,3,s-6,s-6);
    g.strokeStyle="rgba(255,255,255,.25)"; g.lineWidth=1; g.strokeRect(7,7,s-14,s-14);
  },
  roof(g,s){
    g.fillStyle="#343945"; g.fillRect(0,0,s,s);
    const rh=s/4;
    for(let r=0;r<4;r++){
      g.fillStyle="rgba(255,255,255,.07)"; g.fillRect(0,r*rh,s,2);
      g.fillStyle="rgba(0,0,0,.4)"; g.fillRect(0,(r+1)*rh-3,s,3);
      const off = r%2 ? s/4 : 0;
      for(let c=-1;c<3;c++){
        g.fillStyle="rgba(0,0,0,.28)"; g.fillRect(c*s/2+off, r*rh+2, 1.5, rh-4);
      }
    }
    speckle(g,s,120,["#4a5260","#242833"],.4);
    edge(g,s);
  },
  gold(g,s){
    const gr = g.createLinearGradient(0,0,0,s);
    gr.addColorStop(0,"#e8c65a"); gr.addColorStop(.5,"#d3ae42"); gr.addColorStop(1,"#b8922f");
    g.fillStyle=gr; g.fillRect(0,0,s,s);
    for(let i=0;i<46;i++){
      g.strokeStyle = Math.random()<.5 ? `rgba(255,240,190,${R(.05,.16)})` : `rgba(120,88,20,${R(.05,.13)})`;
      g.lineWidth=R(.5,1.4);
      const y=R(0,s);
      g.beginPath(); g.moveTo(0,y); g.lineTo(s,y+R(-2,2)); g.stroke();
    }
    edge(g,s);
  },
  water(g,s){
    const gr = g.createLinearGradient(0,0,0,s);
    gr.addColorStop(0,"#4a9ade"); gr.addColorStop(1,"#3276b4");
    g.fillStyle=gr; g.fillRect(0,0,s,s);
    for(let i=0;i<10;i++){
      g.strokeStyle=`rgba(205,238,255,${R(.12,.3)})`; g.lineWidth=R(.8,2);
      g.beginPath();
      let x=R(-10,s), y=R(0,s); g.moveTo(x,y);
      for(let j=0;j<5;j++){ g.quadraticCurveTo(x+R(4,10), y+R(-5,5), x+=R(10,22), y+=R(-3,3)); }
      g.stroke();
    }
  },
  light(g,s){
    const gr = g.createRadialGradient(s/2,s/2,4,s/2,s/2,s*.7);
    gr.addColorStop(0,"#fff8e2"); gr.addColorStop(.55,"#f6dfa8"); gr.addColorStop(1,"#d8b070");
    g.fillStyle=gr; g.fillRect(0,0,s,s);
    g.strokeStyle="#8a7347"; g.lineWidth=3; g.strokeRect(2,2,s-4,s-4);
  },
  door(g,s){
    g.fillStyle="#d6cfbf"; g.fillRect(0,0,s,s);
    speckle(g,s,180,["#c2bbab","#e4ddcc"],.4);
    const dw=s*.3, dx=(s-dw)/2, dy=s*.2;
    g.fillStyle="#4e3319"; g.fillRect(dx-3, dy-3, dw+6, s-dy+3);
    g.fillStyle="#6b4522"; g.fillRect(dx, dy, dw, s-dy);
    g.strokeStyle="rgba(30,17,6,.6)"; g.lineWidth=2;
    g.strokeRect(dx+4, dy+5, dw-8, (s-dy)*.42);
    g.strokeRect(dx+4, dy+(s-dy)*.52, dw-8, (s-dy)*.42);
    g.fillStyle="#d3ae42"; g.beginPath(); g.arc(dx+dw-6, dy+(s-dy)*.5, 2.4, 0, 6.3); g.fill();
    edge(g,s);
  },
  container(g,s){
    g.fillStyle="#c2572e"; g.fillRect(0,0,s,s);
    for(let x=0;x<s;x+=8){
      g.fillStyle="rgba(255,190,150,.16)"; g.fillRect(x,0,3,s);
      g.fillStyle="rgba(60,20,5,.22)";     g.fillRect(x+5,0,3,s);
    }
    for(let i=0;i<7;i++){
      g.fillStyle=`rgba(70,35,18,${R(.12,.3)})`;
      g.beginPath(); g.ellipse(R(0,s),R(0,s),R(4,14),R(3,8),R(0,6.3),0,6.3); g.fill();
    }
    g.fillStyle="rgba(40,15,5,.5)"; g.fillRect(0,0,s,4); g.fillRect(0,s-4,s,4);
    edge(g,s);
  },
  stonefloor(g,s){
    g.fillStyle="#a49d8e"; g.fillRect(0,0,s,s);
    const ts2=s/2;
    for(let r=0;r<2;r++) for(let c=0;c<2;c++){
      g.fillStyle=`rgb(${182+R(-16,10)|0},${175+R(-14,10)|0},${160+R(-14,10)|0})`;
      g.fillRect(c*ts2+2, r*ts2+2, ts2-4, ts2-4);
    }
    speckle(g,s,220,["#8f887a","#c8c1b2"],.4);
    edge(g,s);
  },
  grass(g,s){
    g.fillStyle="#31402c"; g.fillRect(0,0,s,s);
    speckle(g,s,700,["#3c5233","#2b3a26","#49603a","#26301f"],.6);
    for(let i=0;i<90;i++){
      g.fillStyle=`rgba(90,120,70,${R(.2,.5)})`;
      g.fillRect(R(0,s), R(0,s), 1, R(2,4));
    }
  },
};

let waterTex;
function texFor(name, rep){
  const t = makeTex(P[name]);
  t.repeat.set(rep[0], rep[1]);
  return t;
}
function stdMat(mapName, rep, o={}){
  const map = texFor(mapName, rep);
  const m = new THREE.MeshStandardMaterial({
    map,
    transparent: !!o.trans, opacity: o.trans ? .5 : 1, depthWrite: !o.trans,
    roughness: o.rough ?? .85, metalness: o.metal ?? 0,
    envMapIntensity: o.env ?? .35,
  });
  if(o.isWater) waterTex = map;
  return m;
}
const GEOS = TYPES.map(t => new THREE.BoxGeometry(t.w, t.h, t.d));
const MATS = TYPES.map(t=>{
  if(t.top){ // 上下不同面：樓板／屋頂／泳池
    const side = stdMat(t.side, [2,.3]);
    const top = t.waterTop
      ? stdMat("water", t.repTop, {rough:.05, env:1, isWater:true})
      : stdMat(t.top, t.repTop, {rough:t.isRoof ? .7 : .8});
    return [side, side, top, side, side, side];
  }
  const o = {};
  if(t.transparent){ o.trans = true; o.rough = .06; o.env = 1; }
  if(t.metalHull){ o.metal = .45; o.rough = .5; o.env = .6; }
  if(t.id === "wallM" || t.id === "col"){ o.rough = .38; }
  return stdMat(t.tex, t.rep, o);
});

// ─── 構件資料 ───────────────────────────────────────
let midSeq = 1;
function dimsOf(t, r){
  const T = TYPES[t];
  return r%2 ? {hx:T.d/2, hz:T.w/2} : {hx:T.w/2, hz:T.d/2};
}
function aabbOf(u){
  const {hx,hz} = dimsOf(u.t, u.rot), T = TYPES[u.t];
  return {minX:u.cx-hx, maxX:u.cx+hx, minY:u.y, maxY:u.y+T.h, minZ:u.cz-hz, maxZ:u.cz+hz};
}
function overlapVol(a,b){
  const x = Math.min(a.maxX,b.maxX)-Math.max(a.minX,b.minX);
  const y = Math.min(a.maxY,b.maxY)-Math.max(a.minY,b.minY);
  const z = Math.min(a.maxZ,b.maxZ)-Math.max(a.minZ,b.minZ);
  return (x>0 && y>0 && z>0) ? x*y*z : 0;
}
function addMod(t, cx, y, cz, r, silent){
  const T = TYPES[t];
  const m = new THREE.Mesh(GEOS[t], MATS[t]);
  m.rotation.y = r*Math.PI/2;
  m.position.set(cx, y+T.h/2, cz);
  m.castShadow = !T.transparent;
  m.receiveShadow = true;
  const mid = midSeq++;
  m.userData = {mid, t, cx, y, cz, rot:r};
  scene.add(m);
  blocks.set(mid, m);
  if(!silent) S.lux += T.lux;
  return m;
}
function delMod(mid){
  const m = blocks.get(mid);
  if(!m) return null;
  scene.remove(m);
  blocks.delete(mid);
  S.lux -= TYPES[m.userData.t].lux;
  return m.userData;
}
function starterPad(){
  const sl = TYPES.findIndex(t=>t.id==="slab");
  for(const [x,z] of [[-2,-2],[2,-2],[-2,2],[2,2]]) addMod(sl, x, 0, z, 0, true);
  S.lux += 4*TYPES[sl].lux; S.budget -= 4*TYPES[sl].cost;
}

let yaw = 0.46, pitch = -0.24, sel = 1, rot = 0;
const keys = {};
addEventListener("keydown", e=>{
  if(e.code==="Space") e.preventDefault();
  if(e.repeat) return;
  keys[e.code] = true;
  if(e.code.startsWith("Digit")){
    const n = (+e.code.slice(5) + 9) % 10; // 1→0 … 9→8，0→9
    if(n < TYPES.length){ sel = n; renderHotbar(); }
  }
  if(e.code==="KeyR") rot = (rot+1)%4;
  if(e.code==="KeyX" && started && !paused) breakBlock();
  if(e.code==="KeyB") openShop();
  if(e.code==="KeyN") skipMonth();
});
addEventListener("keyup", e=>keys[e.code]=false);

const cv = renderer.domElement;
let locked = false, dragging = false, dragMoved = 0, lx=0, ly=0;
document.addEventListener("pointerlockchange", ()=>{
  locked = document.pointerLockElement === cv;
  showHint(locked ? "" : started && !paused ? "點擊畫面回到遊戲" : "");
});
function tryLock(){ cv.requestPointerLock && cv.requestPointerLock(); }
function look(mx,my){
  yaw   -= mx*0.0023;
  pitch -= my*0.0023;
  pitch = Math.max(-1.45, Math.min(1.45, pitch));
}
addEventListener("mousemove", e=>{
  if(locked) look(e.movementX, e.movementY);
  else if(dragging){
    look(e.clientX-lx, e.clientY-ly);
    dragMoved += Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly);
    lx=e.clientX; ly=e.clientY;
  }
});
cv.addEventListener("mousedown", e=>{
  if(IS_TOUCH || !started || paused) return; // 觸控裝置只用畫面按鈕操作，避免誤拆
  if(!locked){
    if(e.button===0){ dragging=true; dragMoved=0; lx=e.clientX; ly=e.clientY; }
    return;
  }
  if(e.button===0) breakBlock();
  if(e.button===2) placeBlock();
});
addEventListener("mouseup", e=>{
  if(dragging && e.button===0){
    dragging=false;
    if(dragMoved < 6) tryLock(); // 純點擊只做鎖定，不再自動當拆除
  }
});
cv.addEventListener("dblclick", ()=>{ // 無法鎖定滑鼠的環境：雙擊拆除
  if(!IS_TOUCH && started && !paused && !locked) breakBlock();
});
cv.addEventListener("contextmenu", e=>{
  e.preventDefault();
  if(!IS_TOUCH && started && !paused && !locked) placeBlock();
});

// ─── 觸控 ───────────────────────────────────────────
let joyV = {x:0, y:0}, flyUp = 0;
if(IS_TOUCH){
  const joy = $("joy"), knob = joy.querySelector("i");
  let jid = null, jx=0, jy=0;
  joy.addEventListener("touchstart", e=>{
    const t=e.changedTouches[0]; jid=t.identifier; jx=t.clientX; jy=t.clientY; e.preventDefault();
  });
  addEventListener("touchmove", e=>{
    for(const t of e.changedTouches){
      if(t.identifier===jid){
        joyV.x = Math.max(-1,Math.min(1,(t.clientX-jx)/40));
        joyV.y = Math.max(-1,Math.min(1,(t.clientY-jy)/40));
        knob.style.transform = `translate(calc(-50% + ${joyV.x*28}px), calc(-50% + ${joyV.y*28}px))`;
      }else if(t.identifier===lookId){
        look((t.clientX-lx)*2.2, (t.clientY-ly)*2.2); lx=t.clientX; ly=t.clientY;
      }
    }
  }, {passive:true});
  addEventListener("touchend", e=>{
    for(const t of e.changedTouches){
      if(t.identifier===jid){ jid=null; joyV={x:0,y:0}; knob.style.transform="translate(-50%,-50%)"; }
      if(t.identifier===lookId) lookId=null;
    }
  });
  let lookId = null;
  cv.addEventListener("touchstart", e=>{
    const t=e.changedTouches[0];
    if(lookId===null){ lookId=t.identifier; lx=t.clientX; ly=t.clientY; }
  }, {passive:true});
  const hold = (id,fn)=>{ let iv; const el=$(id);
    el.addEventListener("touchstart",e=>{e.preventDefault();fn();iv=setInterval(fn,220);});
    el.addEventListener("touchend",()=>clearInterval(iv)); };
  hold("t-place", ()=>placeBlock());
  hold("t-break", ()=>breakBlock());
  $("t-up").addEventListener("touchstart",e=>{e.preventDefault();flyUp=1});
  $("t-up").addEventListener("touchend",()=>flyUp=0);
  $("t-down").addEventListener("touchstart",e=>{e.preventDefault();flyUp=-1});
  $("t-down").addEventListener("touchend",()=>flyUp=0);
  $("t-rot").addEventListener("touchstart",e=>{e.preventDefault(); rot=(rot+1)%4;});
}

// ─── 準星射線與構件放置 ─────────────────────────────
const ray = new THREE.Raycaster();
ray.far = 14;
const snap = v => Math.round(v*2)/2;
function targetPlace(){
  ray.setFromCamera({x:0,y:0}, camera);
  const hits = ray.intersectObjects([...blocks.values(), ground], false);
  if(!hits.length) return null;
  const h = hits[0];
  const {hx,hz} = dimsOf(sel, rot);
  let cx, cz, y;
  if(h.object === ground){
    cx = snap(h.point.x); cz = snap(h.point.z); y = 0;
    return {hit:null, place:{cx,cz,y}};
  }
  const u = h.object.userData;
  const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
  n.set(Math.round(n.x), Math.round(n.y), Math.round(n.z));
  const A = aabbOf(u);
  if(n.y > 0){          // 頂面：往上疊
    y = A.maxY; cx = snap(h.point.x); cz = snap(h.point.z);
  }else if(n.y < 0){    // 底面：不可放
    return {hit:h.object, place:null};
  }else{                // 側面：貼著接續，同一個基準高度
    y = u.y;
    if(n.x){ cx = snap(n.x>0 ? A.maxX+hx : A.minX-hx); cz = snap(h.point.z); }
    else   { cz = snap(n.z>0 ? A.maxZ+hz : A.minZ-hz); cx = snap(h.point.x); }
  }
  return {hit:h.object, place:{cx,cz,y:Math.round(y*20)/20}};
}
function validPlace(p){
  const T = TYPES[sel], {hx,hz} = dimsOf(sel, rot);
  if(Math.abs(p.cx)+hx > RANGE || Math.abs(p.cz)+hz > RANGE) return false;
  if(p.y < 0 || p.y + T.h > MAX_Y) return false;
  const g = {minX:p.cx-hx, maxX:p.cx+hx, minY:p.y+.02, maxY:p.y+T.h-.02, minZ:p.cz-hz, maxZ:p.cz+hz};
  for(const m of blocks.values())
    if(overlapVol(g, aabbOf(m.userData)) > .5) return false; // 允許牆角等薄交疊
  const c = camera.position; // 不能蓋在自己身上
  if(c.x>g.minX-.4 && c.x<g.maxX+.4 && c.y>g.minY-.2 && c.y<g.maxY+1.7 && c.z>g.minZ-.4 && c.z<g.maxZ+.4) return false;
  return true;
}
function placeBlock(){
  if(S.over) return;
  const t = targetPlace();
  if(!t || !t.place || !validPlace(t.place)) return;
  const T = TYPES[sel];
  if(S.budget < T.cost){ pushLog("event", `預算不足，「${T.name}」要 ${W(T.cost)}。`); renderHUD(); return; }
  addMod(sel, t.place.cx, t.place.y, t.place.cz, rot);
  S.budget -= T.cost; renderHUD(); queueSave();
}
function breakBlock(){
  if(S.over) return;
  const t = targetPlace();
  if(!t || !t.hit) return;
  const d = delMod(t.hit.userData.mid);
  if(d){ S.budget += Math.floor(TYPES[d.t].cost/2); renderHUD(); queueSave(); } // 拆除退一半
}

// ─── HUD ────────────────────────────────────────────
function renderHUD(){
  $("s-budget").textContent = W(S.budget);
  $("s-budget").className = "value" + (S.budget<0 ? " debt" : "");
  $("s-lux").textContent = S.lux;
  $("s-month").textContent = S.over ? "完工" : `第 ${S.month} 月`;
  for(const p of PROTS) $("p-"+p.key).classList.toggle("on", S.prot[p.key]);
}
function renderHotbar(){
  const bar = $("hotbar");
  bar.innerHTML = "";
  TYPES.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "slot" + (i===sel ? " sel" : "");
    d.innerHTML = `<div class="chip" style="background:#${t.color.toString(16).padStart(6,"0")}"></div>` +
      `<div class="n">${t.name}</div><div class="p">${t.cost}萬 <span class="k">${(i+1)%10}</span></div>`;
    d.addEventListener("click", ()=>{ sel=i; renderHotbar(); });
    bar.appendChild(d);
  });
}
const logs = [];
function pushLog(cls, text){
  logs.unshift({cls, text});
  const feed = $("logfeed");
  feed.innerHTML = "";
  for(const l of logs.slice(0,5)){
    const d = document.createElement("div");
    d.className = "entry "+l.cls;
    d.textContent = l.text;
    feed.appendChild(d);
  }
}
function showHint(t){ const h=$("hint"); h.textContent=t; h.hidden=!t; }

// ─── 月份與事件 ─────────────────────────────────────
function skipMonth(){ if(started && !paused && !S.over) advanceMonth(); }
$("btn-skip").addEventListener("click", e=>{ e.currentTarget.blur(); skipMonth(); });
function advanceMonth(){
  monthT = 0;
  if(S.month >= MONTHS){ finish(); return; }
  S.month++;
  const r = Math.random();
  if(r < .30) fireDisaster();
  else if(r < .62) fireEvent();
  else pushLog("", `第 ${S.month} 月：風平浪靜，工程順利。`);
  renderHUD(); queueSave();
}

function fireDisaster(){
  const d = DISASTERS[Math.floor(Math.random()*DISASTERS.length)];
  const safe = S.prot[d.key];
  const effects = [];
  let removed = 0;
  if(!safe){
    const victims = [...blocks.entries()].filter(([k,m]) => d.pick(m.userData, TYPES[m.userData.t]));
    const n = Math.min(d.cap, Math.floor(victims.length * d.frac));
    for(let i=0;i<n;i++){
      const j = Math.floor(Math.random()*victims.length);
      const [k] = victims.splice(j,1)[0];
      if(delMod(k)) removed++;
    }
  }
  const cash = safe ? d.lightCash : d.cash;
  S.budget -= cash;
  effects.push({text:`修繕費 −${W(cash)}`, good:false});
  if(removed) effects.push({text:`${removed} 件建築構件被摧毀`, good:false});
  effects.push({text:safe ? d.lightNote : d.heavyNote, good:safe});
  if(d.key==="quake") shakeT = safe ? .6 : 1.6;
  if(d.key==="typhoon" || d.key==="flood") startRain(safe ? 6 : 12);
  if(d.key==="fire" && !safe) fireFlash();
  pushLog("disaster", `${d.icon} ${d.name}！${safe ? d.lightNote : d.heavyNote}，−${W(cash)}${removed?`，損毀 ${removed} 塊`:""}。`);
  showCard({disaster:true, icon:d.icon, title:d.name, flavor:d.flavor, effects});
}
function fireEvent(){
  const e = EVENTS[Math.floor(Math.random()*EVENTS.length)];
  const cash = e.cash||0, lux = e.lux||0;
  S.budget += cash; S.lux += lux;
  const effects = [];
  if(cash) effects.push({text:`${cash>0?"+":"−"}${W(Math.abs(cash))}`, good:cash>0});
  if(lux)  effects.push({text:`豪華度 +${lux}`, good:true});
  pushLog(cash>=0 ? "gain" : "event", `${e.icon} ${e.name}：${e.flavor}`);
  showCard({disaster:false, icon:e.icon, title:e.name, flavor:e.flavor, effects});
}

// ─── 卡片 ───────────────────────────────────────────
function showCard({disaster, icon, title, flavor, effects}){
  paused = true;
  document.exitPointerLock && document.exitPointerLock();
  const fx = effects.map(e=>`<div class="effect ${e.good?"good":"bad"}">${e.text}</div>`).join("");
  $("modal-root").innerHTML =
    `<div class="overlay"><div class="card ${disaster?"disaster":""}">` +
    `<div class="big">${icon}</div><h3>${title}</h3><p>${flavor}</p>${fx}` +
    `<button class="main" id="card-ok">${disaster?"面對現實":"知道了"}</button></div></div>`;
  const ok = $("card-ok"); ok.focus();
  ok.addEventListener("click", ()=>{
    $("modal-root").innerHTML = "";
    if(checkBankrupt()) return;
    paused = false;
    if(!IS_TOUCH) tryLock();
  });
}

// ─── 防災商店 ───────────────────────────────────────
$("btn-shop").addEventListener("click", e=>{ e.currentTarget.blur(); openShop(); });
function openShop(){
  if(!started || S.over) return;
  paused = true;
  document.exitPointerLock && document.exitPointerLock();
  const rows = PROTS.map(p=>{
    const owned = S.prot[p.key];
    return `<div class="shoprow ${owned?"owned":""}"><span class="ic">${p.icon}</span>` +
      `<div class="inf"><div class="n">${p.name}　<span style="color:var(--gold)">${owned?"已完工":W(p.cost)}</span></div>` +
      `<div class="d">${p.desc}</div></div>` +
      `<button data-k="${p.key}" ${owned||S.budget<p.cost?"disabled":""}>${owned?"✓":"施作"}</button></div>`;
  }).join("");
  $("modal-root").innerHTML =
    `<div class="overlay"><div class="card"><div class="big">🛡️</div><h3>防災工程</h3>` +
    `<p style="font-size:13px;color:var(--muted)">天有不測風雲——先花小錢，才不會災後花大錢。</p>` +
    rows + `<button class="main" id="shop-close">回到工地</button></div></div>`;
  $("modal-root").querySelectorAll("button[data-k]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const p = PROTS.find(x=>x.key===b.dataset.k);
      if(S.prot[p.key] || S.budget < p.cost) return;
      S.budget -= p.cost; S.prot[p.key] = true;
      pushLog("gain", `完成「${p.name}」，−${W(p.cost)}。`);
      renderHUD(); queueSave(); openShop();
    });
  });
  $("shop-close").addEventListener("click", ()=>{
    $("modal-root").innerHTML = ""; paused = false;
    if(!IS_TOUCH) tryLock();
  });
}

// ─── 結局 ───────────────────────────────────────────
function checkBankrupt(){
  if(S.budget < -500 && !S.over){
    endGame("💸", "破產收場", "負債累累，豪宅夢碎。記得留週轉金，並及早施作防災工程。");
    return true;
  }
  return false;
}
function finish(){
  const score = S.lux + Math.max(0, Math.floor(S.budget/100));
  let icon, rank, note;
  if(blocks.size===0){ icon="🏚️"; rank="一片空地"; note="十二個月過去，這裡連一塊磚都沒有。"; }
  else if(score>=600){ icon="👑"; rank="傳世豪邸"; note="建築雜誌爭相報導，這座宅邸將流傳百年。"; }
  else if(score>=350){ icon="🏰"; rank="頂級豪宅"; note="氣派非凡，賓客無不驚嘆。"; }
  else if(score>=150){ icon="🏡"; rank="精品美宅"; note="舒適有品味，是理想的家。"; }
  else{ icon="🛖"; rank="樸實小屋"; note="雖然簡單，但遮風避雨綽綽有餘。"; }
  endGame(icon, rank, note, score);
}
function endGame(icon, rank, note, score){
  S.over = true; paused = true;
  document.exitPointerLock && document.exitPointerLock();
  renderHUD(); queueSave();
  const rows =
    `<tr><td>豪華度</td><td>${S.lux}</td></tr>` +
    `<tr><td>剩餘預算</td><td>${W(S.budget)}</td></tr>` +
    `<tr><td>建築構件</td><td>${blocks.size} 件</td></tr>` +
    (score!=null ? `<tr><td>總分</td><td>${score}</td></tr>` : "");
  $("modal-root").innerHTML =
    `<div class="overlay"><div class="card ending"><div class="big">${icon}</div>` +
    `<h3 style="font-size:14px;letter-spacing:.3em;font-weight:600">最終評定</h3>` +
    `<div class="rank">${rank}</div><p>${note}</p><table>${rows}</table>` +
    `<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">` +
    `<button class="alt" id="dl3d">下載 3D 模型</button>` +
    `<button class="main" id="restart">再蓋一棟</button></div>` +
    `<p style="font-size:11px;color:var(--muted);margin:8px 0 0">GLB 格式，可匯入 Blender 等 3D 軟體</p></div></div>`;
  $("dl3d").addEventListener("click", ()=>download3D($("dl3d")));
  $("restart").addEventListener("click", ()=>{
    for(const k of [...blocks.keys()]){ const m=blocks.get(k); scene.remove(m); blocks.delete(k); }
    S = freshS(); monthT = 0; starterPad();
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    $("modal-root").innerHTML = ""; paused = false;
    pushLog("gain", "新的一年開始，重新開工！");
    renderHUD(); queueSave();
    if(!IS_TOUCH) tryLock();
  });
}

// ─── 3D 模型匯出（GLB）─────────────────────────────
function exportGLB(){
  return new Promise((resolve, reject)=>{
    if(!THREE.GLTFExporter) return reject(new Error("匯出器尚未載入"));
    if(!blocks.size) return reject(new Error("沒有任何構件"));
    const group = new THREE.Group();
    group.name = "GoldenManor";
    for(const m of blocks.values()){
      const c = new THREE.Mesh(m.geometry, m.material);
      c.position.copy(m.position);
      c.rotation.copy(m.rotation);
      c.name = TYPES[m.userData.t].id + "_" + m.userData.mid;
      group.add(c);
    }
    new THREE.GLTFExporter().parse(group, resolve, reject, {binary:true});
  });
}
// 單檔 STORE 模式 ZIP（Artifact 環境的下載白名單只收 .zip）
const CRC_T = (()=>{
  const t = new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[i]=c; }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function buildZip(name, u8){
  const nb = new TextEncoder().encode(name);
  const crc = crc32(u8);
  const lfh = 30+nb.length, cdh = 46+nb.length;
  const out = new Uint8Array(lfh + u8.length + cdh + 22);
  const dv = new DataView(out.buffer);
  let p = 0;
  dv.setUint32(p,0x04034b50,true); dv.setUint16(p+4,20,true);
  dv.setUint32(p+14,crc,true); dv.setUint32(p+18,u8.length,true); dv.setUint32(p+22,u8.length,true);
  dv.setUint16(p+26,nb.length,true);
  out.set(nb, p+30); p += lfh;
  out.set(u8, p); p += u8.length;
  const cdOff = p;
  dv.setUint32(p,0x02014b50,true); dv.setUint16(p+4,20,true); dv.setUint16(p+6,20,true);
  dv.setUint32(p+16,crc,true); dv.setUint32(p+20,u8.length,true); dv.setUint32(p+24,u8.length,true);
  dv.setUint16(p+28,nb.length,true);
  out.set(nb, p+46); p += cdh;
  dv.setUint32(p,0x06054b50,true); dv.setUint16(p+8,1,true); dv.setUint16(p+10,1,true);
  dv.setUint32(p+12,cdh,true); dv.setUint32(p+16,cdOff,true);
  return out;
}
async function download3D(btn){
  btn.disabled = true; btn.textContent = "匯出中…";
  try{
    const glb = await exportGLB();
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if(dl){ // Artifact 環境：官方下載 API，打包成 zip
      const zip = buildZip("golden-manor.glb", new Uint8Array(glb));
      await dl.save({filename:"golden-manor-3d.zip", data:new Blob([zip])});
    }else{ // 一般網頁（GitHub Pages）：直接下載 .glb
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([glb], {type:"model/gltf-binary"}));
      a.download = "golden-manor.glb";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
    }
    btn.textContent = "已下載 ✓";
  }catch(err){
    btn.textContent = err && err.code === "declined" ? "已取消" : "匯出失敗";
  }
  setTimeout(()=>{ btn.disabled = false; btn.textContent = "下載 3D 模型"; }, 2600);
}

// ─── 存檔 ───────────────────────────────────────────
const SAVE_KEY = "golden-manor-3d-v2";
function snapshot(){
  return {...S, mods:[...blocks.values()].map(m=>{
    const u = m.userData; return [u.t, u.cx, u.y, u.cz, u.rot];
  })};
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    const snap = snapshot();
    try{ window.claude?.hot?.snapshot?.(snap); }catch(e){}
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(snap)); }catch(e){}
  }, 400);
}
function restore(data){
  S = freshS();
  for(const k of Object.keys(S)) if(k in data && k!=="prot") S[k]=data[k];
  if(data.prot) S.prot = {...S.prot, ...data.prot};
  for(const [t,cx,y,cz,r] of data.mods||[]) addMod(t, cx, y, cz, r||0, true);
}

// ─── 開始畫面 ───────────────────────────────────────
function showStart(){
  const ctrl = IS_TOUCH ?
    `<table><tr><td>左搖桿</td><td>移動</td></tr><tr><td>右側拖曳</td><td>轉視角</td></tr>` +
    `<tr><td>放置／拆除</td><td>對準星處操作</td></tr><tr><td>旋轉</td><td>轉構件方向</td></tr><tr><td>上升／下降</td><td>飛行</td></tr></table>` :
    `<table><tr><td>W A S D</td><td>移動</td></tr><tr><td>空白鍵 / Shift</td><td>上升 / 下降（飛行）</td></tr>` +
    `<tr><td>滑鼠</td><td>視角（點畫面鎖定）</td></tr><tr><td>左鍵 / 右鍵</td><td>拆除 / 放置構件</td></tr>` +
    `<tr><td>R</td><td>旋轉構件方向</td></tr>` +
    `<tr><td>1–0 或滾輪</td><td>選構件</td></tr><tr><td>B / N</td><td>防災工程 / 跳月</td></tr></table>`;
  $("modal-root").innerHTML =
    `<div class="overlay" id="start"><div class="card">` +
    `<h1>金邸計畫</h1><div class="tag">第一人稱建造版・十二個月・一億預算</div>` +
    `<p style="font-size:13px">用一面面牆、樓板、玻璃帷幕——甚至整個貨櫃，組裝出你的豪宅。每 ${MONTH_SECS} 秒過一個月，` +
    `小心突發事件與天災——先做防災工程能保住你的心血。</p>` + ctrl +
    `<button class="main" id="go">開始建造</button>` +
    `<div class="foot">比較喜歡 2D 經營版？<a href="classic.html">點這裡</a></div></div></div>`;
  $("go").addEventListener("click", ()=>{
    $("modal-root").innerHTML = "";
    started = true; paused = false;
    if(IS_TOUCH){ try{ document.documentElement.requestFullscreen?.(); }catch(e){} }
    else tryLock();
    pushLog("gain", "開工！先鋪地基，記得留錢做防災工程。");
  });
}

// ─── 主迴圈 ─────────────────────────────────────────
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .1);

  if(started && !paused && !S.over){
    // 移動（飛行）
    const sp = 8*dt;
    const f = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const r = new THREE.Vector3(-f.z,0,f.x); // 右向量 = forward × up
    let mx=0,mz=0,my=0;
    if(keys.KeyW) mz+=1; if(keys.KeyS) mz-=1;
    if(keys.KeyD) mx+=1; if(keys.KeyA) mx-=1;
    if(keys.Space) my+=1; if(keys.ShiftLeft||keys.ShiftRight) my-=1;
    mz -= joyV.y; mx += joyV.x; my += flyUp;
    camera.position.addScaledVector(f, mz*sp).addScaledVector(r, mx*sp);
    camera.position.y = Math.max(1.2, Math.min(MAX_Y+6, camera.position.y + my*sp));

    // 月份計時
    monthT += dt;
    $("monthfill").style.width = Math.min(100, monthT/MONTH_SECS*100)+"%";
    if(monthT >= MONTH_SECS) advanceMonth();

    // 預覽鬼影（金色＝可放，紅色＝不可）
    const t = targetPlace();
    if(t && t.place){
      const T = TYPES[sel], {hx,hz} = dimsOf(sel, rot);
      ghost.scale.set(hx*2, T.h, hz*2);
      ghost.position.set(t.place.cx, t.place.y+T.h/2, t.place.cz);
      ghost.material.color.set(validPlace(t.place) ? 0xc9a35c : 0xd9564a);
      ghost.visible = true;
    }else ghost.visible = false;
  }else ghost.visible = false;

  // 環境動態：池水流動、雲飄、雨落
  if(waterTex){ waterTex.offset.y += dt*.028; waterTex.offset.x += dt*.011; }
  for(const c of clouds){ c.position.x += dt*.7; if(c.position.x > 150) c.position.x = -150; }
  if(weatherT > 0){
    weatherT -= dt;
    const arr = rainGeo.attributes.position.array;
    for(let i=0;i<RAIN_N;i++){
      arr[i*3+1] -= 26*dt;
      arr[i*3]   += 4*dt;
      if(arr[i*3+1] < 0){ arr[i*3+1] = 36; arr[i*3] = R(-38,38); arr[i*3+2] = R(-38,38); }
    }
    rainGeo.attributes.position.needsUpdate = true;
    if(weatherT <= 0) rain.visible = false;
  }

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  if(shakeT > 0){
    shakeT -= dt;
    camera.position.x += (Math.random()-.5)*.14;
    camera.position.y += (Math.random()-.5)*.14;
  }
  renderer.render(scene, camera);
}
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── 啟動 ───────────────────────────────────────────
function boot(data){
  blocks = new Map();
  if(IS_TOUCH){ $("btn-shop").textContent = "防災工程"; $("btn-skip").textContent = "跳到下個月"; }
  if(!data){
    try{ data = JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ data = null; }
  }
  if(data && data.mods && !data.over){ restore(data); }
  else{ S = freshS(); starterPad(); }
  renderHUD(); renderHotbar(); showStart(); tick();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? null);
</script>
