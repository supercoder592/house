<title>金邸計畫 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#111318;
    --panel:rgba(17,19,24,.82);
    --line:#32363f;
    --gold:#c9a35c;
    --gold-soft:#8a7347;
    --ivory:#efe9dc;
    --muted:#9a9689;
    --good:#7fb98a;
    --bad:#d97b6c;
  }
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--ivory);
    font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:15px;line-height:1.6;overflow:hidden;
    padding-block:0;padding-inline:0;
  }
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none;-webkit-touch-callout:none}
  body{overscroll-behavior:none}

  /* ── HUD ── */
  .hud{position:fixed;z-index:5;pointer-events:none}
  #stats{
    top:12px;left:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100vw - 24px);
  }
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:6px 12px;min-width:96px;backdrop-filter:blur(4px);
  }
  .stat .label{font-size:10px;letter-spacing:.18em;color:var(--muted)}
  .stat .value{
    font-family:"Noto Serif TC",serif;font-weight:900;font-size:17px;
    font-variant-numeric:tabular-nums;color:var(--gold);line-height:1.3;
  }
  .stat .value.debt{color:var(--bad)}
  .stat .value.plain{color:var(--ivory)}
  #monthbar{height:3px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
  #monthbar i{display:block;height:100%;background:var(--gold);width:0%}

  #protbar{top:12px;right:12px;display:flex;gap:6px}
  .prot{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    font-size:18px;opacity:.32;backdrop-filter:blur(4px);
  }
  .prot.on{opacity:1;border-color:var(--gold-soft)}

  #crosshair{
    top:50%;left:50%;transform:translate(-50%,-50%);
    width:18px;height:18px;
  }
  #crosshair::before,#crosshair::after{
    content:"";position:absolute;background:rgba(239,233,220,.85);
  }
  #crosshair::before{left:8px;top:0;width:2px;height:18px}
  #crosshair::after{top:8px;left:0;width:18px;height:2px}

  #logfeed{
    left:12px;bottom:86px;display:flex;flex-direction:column;gap:4px;max-width:min(400px,70vw);
  }
  #logfeed .entry{
    background:var(--panel);border-left:3px solid var(--line);border-radius:0 6px 6px 0;
    padding:3px 10px;font-size:12px;backdrop-filter:blur(4px);
  }
  #logfeed .entry.event{border-left-color:var(--gold)}
  #logfeed .entry.disaster{border-left-color:var(--bad)}
  #logfeed .entry.gain{border-left-color:var(--good)}

  #hotbar{
    bottom:12px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;pointer-events:auto;max-width:calc(100vw - 16px);
    overflow-x:auto;padding:2px;
  }
  .slot{
    background:var(--panel);border:2px solid var(--line);border-radius:8px;
    width:58px;flex:0 0 auto;padding:5px 3px 3px;text-align:center;cursor:pointer;
    backdrop-filter:blur(4px);
  }
  .slot.sel{border-color:var(--gold)}
  .slot .chip{width:22px;height:22px;border-radius:4px;margin:0 auto 2px;border:1px solid rgba(0,0,0,.35)}
  .slot .n{font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot .p{font-size:9px;color:var(--gold);font-variant-numeric:tabular-nums}
  .slot .k{position:relative;top:-2px;font-size:8px;color:var(--muted)}

  #btns{right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
  .hbtn{
    background:var(--panel);border:1px solid var(--gold-soft);color:var(--gold);
    border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13px;cursor:pointer;
    backdrop-filter:blur(4px);
  }
  .hbtn:hover{background:var(--gold);color:var(--ink)}
  .hbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ── 觸控 ── */
  #touchui{display:none}
  @media (pointer:coarse){
    #touchui{display:block;pointer-events:none}
    #joy{
      position:fixed;left:14px;bottom:96px;width:104px;height:104px;border-radius:50%;
      border:2px solid rgba(239,233,220,.35);pointer-events:auto;z-index:6;
      touch-action:none;
    }
    #joy i{
      position:absolute;left:50%;top:50%;width:42px;height:42px;border-radius:50%;
      background:rgba(201,163,92,.5);transform:translate(-50%,-50%);
    }
    .tbtn{
      position:fixed;z-index:6;pointer-events:auto;touch-action:none;
      background:var(--panel);border:1px solid var(--gold-soft);color:var(--ivory);
      border-radius:10px;width:56px;height:48px;font-size:13px;font-family:inherit;
      backdrop-filter:blur(4px);
    }
    #t-place{right:12px;bottom:210px;border-color:var(--good)}
    #t-break{right:12px;bottom:156px;border-color:var(--bad)}
    #t-up{right:74px;bottom:210px}
    #t-down{right:74px;bottom:156px}
    #t-rot{right:136px;bottom:210px}
    #t-cut{right:136px;bottom:156px;border-color:var(--gold-soft);color:var(--gold)}

    /* 手機版 HUD 緊湊排版 */
    #stats{top:8px;left:8px;right:8px;gap:6px;flex-wrap:nowrap}
    .stat{padding:4px 8px;min-width:0;flex:1}
    .stat .label{font-size:9px;letter-spacing:.12em}
    .stat .value{font-size:13px}
    #protbar{top:56px;right:8px}
    .prot{width:30px;height:30px;font-size:14px}
    #btns{top:56px;right:auto;left:8px;bottom:auto;flex-direction:row;gap:6px}
    .hbtn{padding:5px 10px;font-size:12px}
    #logfeed{top:100px;left:8px;bottom:auto;max-width:62vw}
    #logfeed .entry{font-size:11px;padding:2px 8px}
    #hotbar{bottom:6px}
    .slot{width:46px;padding:4px 2px 2px}
    .slot .chip{width:17px;height:17px}
    .slot .n{font-size:9px}
    .slot .p{font-size:8px}
    #hint{top:34%;font-size:12px}
  }
  .card{touch-action:pan-y}

  /* ── 卡片與遮罩 ── */
  .overlay{
    position:fixed;inset:0;background:rgba(8,9,12,.78);z-index:20;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{
    background:#1a1d25;border:1px solid var(--gold-soft);border-radius:14px;
    max-width:440px;width:100%;padding:26px;text-align:center;
    max-height:88vh;overflow-y:auto;
  }
  .card.disaster{border-color:var(--bad)}
  .card .big{font-size:50px;line-height:1;margin-bottom:10px}
  .card h3{
    font-family:"Noto Serif TC",serif;font-weight:900;font-size:23px;margin:0 0 8px;
    color:var(--gold);letter-spacing:.1em;text-wrap:balance;
  }
  .card.disaster h3{color:var(--bad)}
  .card p{margin:0 0 6px}
  .card .effect{font-variant-numeric:tabular-nums;font-weight:700;margin-top:8px}
  .card .effect.bad{color:var(--bad)}
  .card .effect.good{color:var(--good)}
  .card button.main{
    margin-top:18px;background:var(--gold);color:var(--ink);border:none;border-radius:8px;
    padding:10px 30px;font-family:"Noto Serif TC",serif;font-weight:600;font-size:15px;
    letter-spacing:.14em;cursor:pointer;
  }
  .card.disaster button.main{background:var(--bad)}
  .card button.alt{
    margin-top:18px;background:transparent;border:1px solid var(--gold-soft);color:var(--gold);
    border-radius:8px;padding:10px 22px;font-family:"Noto Serif TC",serif;font-weight:600;
    font-size:15px;letter-spacing:.1em;cursor:pointer;
  }
  .card button.alt:disabled{opacity:.6;cursor:wait}
  .card button:focus-visible{outline:2px solid var(--ivory);outline-offset:2px}

  /* 建材目錄 */
  .card.catalog{max-width:760px;text-align:left}
  .card.catalog h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .catcount{font-size:12px;color:var(--muted);letter-spacing:.1em;font-weight:400}
  .cattabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .cattab{
    background:#20242e;border:1px solid var(--line);color:var(--ivory);border-radius:6px;
    padding:4px 12px;font-family:inherit;font-size:13px;cursor:pointer;
  }
  .cattab.on{border-color:var(--gold);color:var(--gold)}
  .catbody{max-height:52vh;overflow-y:auto;padding-right:4px}
  .catfam{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:10px 0 6px}
  .catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:6px}
  .catitem{
    background:#20242e;border:1px solid var(--line);border-radius:8px;
    padding:8px 6px;text-align:center;cursor:pointer;
  }
  .catitem:hover{border-color:var(--gold-soft)}
  .catitem.on{border-color:var(--gold)}
  .catitem .chip{width:26px;height:26px;border-radius:5px;margin:0 auto 4px;border:1px solid rgba(0,0,0,.35)}
  .catitem .cn{font-size:11px;line-height:1.3}
  .catitem .cp{font-size:10px;color:var(--gold);font-variant-numeric:tabular-nums}

  /* 防災商店 */
  .shoprow{
    display:flex;align-items:center;gap:10px;text-align:left;
    background:#20242e;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:8px;
  }
  .shoprow .ic{font-size:20px}
  .shoprow .inf{flex:1;min-width:0}
  .shoprow .inf .n{font-weight:700;font-size:14px}
  .shoprow .inf .d{font-size:12px;color:var(--muted)}
  .shoprow button{
    border:1px solid var(--gold-soft);background:transparent;color:var(--gold);border-radius:6px;
    padding:5px 12px;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .shoprow button:disabled{opacity:.4;cursor:not-allowed}
  .shoprow.owned{border-color:var(--gold-soft)}

  /* 開始畫面 */
  #start h1{
    font-family:"Noto Serif TC",serif;font-weight:900;font-size:34px;margin:0 0 2px;
    color:var(--gold);letter-spacing:.1em;
  }
  #start .tag{font-size:12px;letter-spacing:.2em;color:var(--muted);margin-bottom:14px}
  #start table{margin:0 auto;border-collapse:collapse;font-size:13px}
  #start td{padding:2px 10px;text-align:left}
  #start td:first-child{color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
  #start .foot{margin-top:14px;font-size:12px;color:var(--muted)}
  #start a{color:var(--gold)}

  .ending .rank{
    font-family:"Noto Serif TC",serif;font-weight:900;font-size:32px;color:var(--gold);
    margin:6px 0;letter-spacing:.08em;
  }
  .ending table{margin:12px auto 0;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .ending td{padding:3px 12px;font-size:14px;text-align:left}
  .ending td:last-child{text-align:right;color:var(--gold)}

  #flash{
    position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;
    background:radial-gradient(ellipse at 50% 68%, rgba(255,128,40,.5), rgba(255,60,20,.14) 55%, transparent 78%);
  }
  #hint{
    top:14%;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:6px 16px;font-size:13px;backdrop-filter:blur(4px);white-space:nowrap;
  }
</style>

<div id="app"></div>

<div class="hud" id="stats">
  <div class="stat"><div class="label" id="s-budget-label">預算</div><div class="value" id="s-budget">10,000萬</div></div>
  <div class="stat"><div class="label">豪華度</div><div class="value plain" id="s-lux">0</div></div>
  <div class="stat"><div class="label">進度</div><div class="value plain" id="s-month">第 1 月</div>
    <div id="monthbar"><i id="monthfill"></i></div></div>
</div>
<div class="hud" id="protbar">
  <div class="prot" id="p-quake"   title="制震結構">🏗️</div>
  <div class="prot" id="p-typhoon" title="防颱工法">🪟</div>
  <div class="prot" id="p-fire"    title="消防灑水">🧯</div>
  <div class="prot" id="p-flood"   title="排水閘門">🚧</div>
</div>
<div class="hud" id="crosshair"></div>
<div class="hud" id="logfeed"></div>
<div class="hud" id="hotbar"></div>
<div class="hud" id="btns">
  <button class="hbtn" id="btn-cat">建材目錄 (E)</button>
  <button class="hbtn" id="btn-shop">防災工程 (B)</button>
  <button class="hbtn" id="btn-skip">跳到下個月 (N)</button>
  <button class="hbtn" id="btn-sell" hidden>出售 / 出租</button>
  <button class="hbtn" id="btn-dl">下載 3D</button>
</div>
<div class="hud" id="hint" hidden></div>

<div id="touchui">
  <div id="joy"><i></i></div>
  <button class="tbtn" id="t-place">放置</button>
  <button class="tbtn" id="t-break">拆除</button>
  <button class="tbtn" id="t-up">上升</button>
  <button class="tbtn" id="t-down">下降</button>
  <button class="tbtn" id="t-rot">旋轉</button>
  <button class="tbtn" id="t-cut">切割</button>
</div>

<div id="flash"></div>
<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
"use strict";
const W = v => v.toLocaleString("zh-TW") + "萬";
const $ = id => document.getElementById(id);
const IS_TOUCH = matchMedia("(pointer:coarse)").matches;

// ─── 建材系統：形狀 × 材質家族（500+ 種）──────────────
// 形狀：尺寸（公尺）、基礎價（萬）、基礎豪華、所屬分類
const SHAPES = {
  wall:   {suffix:"牆",     w:4,  h:3,   d:.25, cost:40,  lux:2, cat:"牆面"},
  wallS:  {suffix:"短牆",   w:2,  h:3,   d:.25, cost:24,  lux:1, cat:"牆面"},
  wallLow:{suffix:"矮牆",   w:4,  h:1,   d:.25, cost:16,  lux:1, cat:"牆面"},
  cube:   {suffix:"方塊",   w:1,  h:1,   d:1,   cost:10,  lux:1, cat:"方塊"},
  col:    {suffix:"柱",     w:.5, h:3,   d:.5,  cost:22,  lux:1, cat:"柱樑"},
  beam:   {suffix:"橫樑",   w:4,  h:.4,  d:.4,  cost:20,  lux:1, cat:"柱樑"},
  slab:   {suffix:"樓板",   w:4,  h:.3,  d:4,   cost:55,  lux:2, cat:"樓板"},
  slabS:  {suffix:"小樓板", w:2,  h:.3,  d:2,   cost:30,  lux:1, cat:"樓板"},
  roof:   {suffix:"屋頂板", w:4,  h:.35, d:4,   cost:65,  lux:3, cat:"屋頂", isRoof:true},
  gwall:  {suffix:"帷幕",   w:4,  h:3,   d:.15, cost:90,  lux:6, cat:"玻璃", trans:true},
  gwallS: {suffix:"短帷幕", w:2,  h:3,   d:.15, cost:50,  lux:3, cat:"玻璃", trans:true},
  gLow:   {suffix:"欄杆",   w:4,  h:1,   d:.1,  cost:30,  lux:2, cat:"玻璃", trans:true},
  door:   {suffix:"門牆",   w:4,  h:3,   d:.25, cost:75,  lux:4, cat:"門窗"},
  win:    {suffix:"窗牆",   w:4,  h:3,   d:.25, cost:65,  lux:4, cat:"門窗"},
  cont:   {suffix:"貨櫃屋", w:6,  h:2.6, d:2.5, cost:150, lux:5, cat:"貨櫃"},
  contS:  {suffix:"短貨櫃", w:3,  h:2.6, d:2.5, cost:90,  lux:3, cat:"貨櫃"},
  panel:  {suffix:"發光板", w:4,  h:3,   d:.12, cost:70,  lux:5, cat:"特殊", emissive:true},
  pool:   {suffix:"泳池",   w:4,  h:.6,  d:4,   cost:200, lux:10, cat:"特殊", pool:true},
};
// 塗裝色相自動生成（18 色相 × 亮/深 = 36 色）
const HUE_NAMES = ["緋紅","橘紅","橙","琥珀","金黃","黃綠","草綠","翠綠","碧綠","青","湖藍","天藍","寶藍","靛","紫","紫紅","桃紅","粉櫻"];
const PAINT_MATS = [];
HUE_NAMES.forEach((n,i)=>{
  PAINT_MATS.push([`pt${i}a`, `亮${n}塗裝`, `hsl(${i*20},52%,64%)`]);
  PAINT_MATS.push([`pt${i}b`, `深${n}塗裝`, `hsl(${i*20},38%,38%)`]);
});
// 材質家族：painter 名稱、價格/豪華倍率、可用形狀、色樣 [id, 名稱, 主色, 副色?]
const FAMS = [
  {painter:"concrete", label:"混凝土", mult:1, luxM:1,
   shapes:["wall","wallS","wallLow","cube","col","beam","slab","slabS"],
   mats:[["cc1","淺灰混凝土","#989da2"],["cc2","深灰混凝土","#6f747a"],["cc3","米白混凝土","#b6b1a4"],
         ["cc4","暖沙混凝土","#a89b86"],["cc5","青灰混凝土","#8a949c"],["cc6","炭黑混凝土","#4a4e54"]]},
  {painter:"marble", label:"大理石", mult:2.6, luxM:3,
   shapes:["wall","wallS","wallLow","cube","col","slab","slabS"],
   mats:[["mb1","白大理石","#ece6da","#6f6a60"],["mb2","黑金大理石","#2e2e34","#c9a35c"],
         ["mb3","墨綠大理石","#2e4638","#9fb8a6"],["mb4","玫瑰大理石","#d8b8b2","#8f5f58"],
         ["mb5","米黃大理石","#ded2b8","#9a8a68"],["mb6","灰雲大理石","#c6c6c8","#77777c"]]},
  {painter:"granite", label:"花崗岩", mult:1.9, luxM:2,
   shapes:["wall","wallS","wallLow","cube","col","slab","slabS"],
   mats:[["gr1","芝麻花崗岩","#9b9891"],["gr2","紅花崗岩","#9c6b5e"],["gr3","黑花崗岩","#4c4c4e"],["gr4","青花崗岩","#7d8a84"]]},
  {painter:"wood", label:"木作", mult:1.4, luxM:1.6, flags:{flammable:true},
   shapes:["wall","wallS","wallLow","cube","col","beam","slab","slabS"],
   mats:[["wd1","淺橡木","#b08a5c"],["wd2","深胡桃木","#5e3f26"],["wd3","柚木","#8a5a33"],["wd4","紅檜木","#a06a42"],
         ["wd5","白洗木","#c9b9a4"],["wd6","黑檀木","#3a2c22"],["wd7","竹材","#c2a86a"],["wd8","松木","#c09a6a"]]},
  {painter:"brick", label:"磚作", mult:1.1, luxM:1,
   shapes:["wall","wallS","wallLow","cube"],
   mats:[["bk1","紅磚","#a04a3c"],["bk2","橙磚","#b06a44"],["bk3","黃磚","#b89a5e"],
         ["bk4","灰磚","#8a8a86"],["bk5","白磚","#cfc8bc"],["bk6","黑磚","#4c4a48"]]},
  {painter:"stone", label:"石材", mult:1.5, luxM:1.5,
   shapes:["wall","wallS","wallLow","cube","slab","slabS"],
   mats:[["st1","板岩","#5f6468"],["st2","砂岩","#c2a982"],["st3","洞石","#cbbfa8"],["st4","玄武岩","#3c4044"]]},
  {painter:"paint", label:"塗裝", mult:1.05, luxM:1,
   shapes:["wall","wallS","wallLow","cube"], mats:PAINT_MATS},
  {painter:"metal", label:"金屬", mult:2.2, luxM:2.5, flags:{metal:true},
   shapes:["wall","wallS","wallLow","cube","col","beam","roof"],
   mats:[["mt1","拉絲不鏽鋼","#b8bcc2"],["mt2","金箔","#d3ae42"],["mt3","紅銅","#a2643c"],
         ["mt4","鈦黑","#3a3d44"],["mt5","香檳金","#c8b088"],["mt6","青銅綠","#5e7a6a"]]},

// ─── 程序化寫實材質 ─────────────────────────────────
const R = (a,b)=>a+Math.random()*(b-a);
function makeTex(fn, size=128, repeat=1){
  const c = document.createElement("canvas"); c.width = c.height = size;
  fn(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function speckle(g,s,n,cols,a){
  for(let i=0;i<n;i++){
    g.fillStyle = cols[Math.floor(Math.random()*cols.length)];
    g.globalAlpha = R(a*.4, a);
    g.fillRect(R(0,s), R(0,s), R(1,2.4), R(1,2.4));
  }
  g.globalAlpha = 1;
}
function edge(g,s){
  g.strokeStyle="rgba(0,0,0,.20)"; g.lineWidth=2; g.strokeRect(1,1,s-2,s-2);
  g.strokeStyle="rgba(255,255,255,.07)"; g.lineWidth=1;
  g.beginPath(); g.moveTo(2,2); g.lineTo(s-2,2); g.stroke();
}

    for(let i=0;i<3;i++){
      g.strokeStyle="rgba(0,0,0,.22)"; g.lineWidth=.8;
      g.beginPath(); let x=R(0,s), y=R(0,s); g.moveTo(x,y);
      for(let j=0;j<4;j++){ x+=R(-14,14); y+=R(-14,14); g.lineTo(x,y); } g.stroke();
    }
    edge(g,s);

      g.fillStyle=`rgba(255,255,255,${R(.04,.1)})`;
      g.beginPath(); g.ellipse(R(0,s),R(0,s),R(15,42),R(10,28),R(0,6.3),0,6.3); g.fill();

function boxGeo(w,h,d){
  const k = w+","+h+","+d;
  return GEO_CACHE[k] || (GEO_CACHE[k] = new THREE.BoxGeometry(w,h,d));
}
function solid(c, o={}){
  const k = c + "|" + (o.rough??"") + (o.metal??"") + (o.em?1:0);
  if(SOLID_CACHE[k]) return SOLID_CACHE[k];
  return SOLID_CACHE[k] = new THREE.MeshStandardMaterial({
    color:c, roughness:o.rough ?? .8, metalness:o.metal ?? 0,
    emissive:o.em ? c : 0x000000, emissiveIntensity:o.em ? .85 : 0,
    envMapIntensity:.35,
  });
}
function part(gp, w,h,d, x,y,z, mat){
  const b = new THREE.Mesh(boxGeo(w,h,d), mat);
  b.position.set(x,y,z);
  b.castShadow = b.receiveShadow = true;
  gp.add(b);
  return b;
}

function matFor(I){
  if(MAT_CACHE[I.id]) return MAT_CACHE[I.id];
  let m;
  if(I.pool){ // 泳池：頂面水、側面大理石
    const topTex = makeTex((g,s)=>PAINT.waterp(g,s,I), 128);
    topTex.repeat.set(2,2);
    waterTexes.push(topTex);
    const top = new THREE.MeshStandardMaterial({map:topTex, roughness:.05, envMapIntensity:1});
    const sideTex = makeTex((g,s)=>PAINT.marble(g,s,{c:"#ece6da", v:"#8a8478"}), 128);
    sideTex.repeat.set(2,.3);
    const side = new THREE.MeshStandardMaterial({map:sideTex, roughness:.4});
    m = [side, side, top, side, side, side];
  }else{
    const map = makeTex((g,s)=>PAINT[I.painter](g,s,I), 128);
    map.repeat.set(Math.max(1, I.w/2), Math.max(1, I.h/2));
    m = new THREE.MeshStandardMaterial({
      map,
      transparent: I.trans, opacity: I.trans ? .5 : 1, depthWrite: !I.trans,
      roughness: I.metal ? .35 : I.trans ? .06 : I.painter==="marble" ? .38 : .85,
      metalness: I.metal ? .85 : I.painter==="container" ? .4 : 0,
      envMapIntensity: I.metal ? 1.1 : I.trans ? 1 : .35,
      emissive: I.emissive ? 0xffffff : 0x000000,
      emissiveMap: I.emissive ? map : null,
      emissiveIntensity: I.emissive ? .75 : 0,
    });
  }
  MAT_CACHE[I.id] = m;
  return m;
}

          const h = R(16, 34);
          m = new THREE.Mesh(new THREE.ConeGeometry(R(11,22), h, 5), solid("#4a5244", {rough:1}));
          m.position.set(Math.cos(ang)*dist, h/2, Math.sin(ang)*dist);
          m.rotation.y = R(0, 6.28);
        }
        terrainGroup.add(m);
      }
    }
    if(t === "coast"){
      const sea = new THREE.Mesh(new THREE.PlaneGeometry(320, 130),
        new THREE.MeshStandardMaterial({color:0x2e6a9a, roughness:.12, transparent:true, opacity:.92, envMapIntensity:1}));
      sea.rotation.x = -Math.PI/2;
      sea.position.set(0, .04, RANGE+72);
      terrainGroup.add(sea);
      const sand = new THREE.Mesh(new THREE.PlaneGeometry(320, 16), solid("#c8b88a", {rough:1}));
      sand.rotation.x = -Math.PI/2;
      sand.position.set(0, .03, RANGE+9);
      terrainGroup.add(sand);
    }
  }
  scene.add(terrainGroup);
}

// ─── 構件資料 ───────────────────────────────────────
let midSeq = 1;
function dimsOf(t, r){
  const T = ITEMS[t];
  return r%2 ? {hx:T.d/2, hz:T.w/2} : {hx:T.w/2, hz:T.d/2};
}
function aabbOf(u){
  const hx = (u.rot%2 ? u.cd : u.cw)/2, hz = (u.rot%2 ? u.cw : u.cd)/2;
  return {minX:u.cx-hx, maxX:u.cx+hx, minY:u.y, maxY:u.y+u.ch, minZ:u.cz-hz, maxZ:u.cz+hz};
}
function overlapVol(a,b){
  const x = Math.min(a.maxX,b.maxX)-Math.max(a.minX,b.minX);
  const y = Math.min(a.maxY,b.maxY)-Math.max(a.minY,b.minY);
  const z = Math.min(a.maxZ,b.maxZ)-Math.max(a.minZ,b.minZ);
  return (x>0 && y>0 && z>0) ? x*y*z : 0;
}
function addMod(t, cx, y, cz, r, silent, opts){
  const T = ITEMS[t];
  if(!T) return null;
  const o = opts || {};
  const w = o.cw ?? T.w, h = o.ch ?? T.h, d = o.cd ?? T.d;
  let m;
  if(T.furn){
    m = new THREE.Group();
    BUILDERS[T.furn](m, T.c);
    m.position.set(cx, y, cz);
  }else{
    m = new THREE.Mesh(boxGeo(w,h,d), matFor(T));
    m.position.set(cx, y+h/2, cz);
    m.castShadow = !T.trans;
    m.receiveShadow = true;
  }
  m.rotation.y = r*Math.PI/2;
  const mid = midSeq++;
  m.userData = {mid, t, cx, y, cz, rot:r, cw:w, ch:h, cd:d,
    cost: o.cost ?? T.cost, lux: o.lux ?? T.lux};
  scene.add(m);
  blocks.set(mid, m);
  if(!silent) S.lux += m.userData.lux;
  return m;
}
function delMod(mid){
  const m = blocks.get(mid);
  if(!m) return null;
  scene.remove(m);
  blocks.delete(mid);
  S.lux -= m.userData.lux;
  return m.userData;
}
function starterPad(){
  const sl = "slab.mb1"; // 白大理石樓板
  for(const [x,z] of [[-2,-2],[2,-2],[-2,2],[2,2]]) addMod(sl, x, 0, z, 0, true);
  S.lux += 4*ITEMS[sl].lux; S.budget -= 4*ITEMS[sl].cost;
}

// ─── 準星射線與構件放置 ─────────────────────────────
const ray = new THREE.Raycaster();
ray.far = 14;
const snap = v => Math.round(v*2)/2;
function targetPlace(){
  ray.setFromCamera({x:0,y:0}, camera);
  const hits = ray.intersectObjects([...blocks.values(), ground], true);
  if(!hits.length) return null;
  const h = hits[0];
  const {hx,hz} = dimsOf(sel, rot);
  let cx, cz, y;
  if(h.object === ground){
    cx = snap(h.point.x); cz = snap(h.point.z); y = 0;
    return {hit:null, place:{cx,cz,y}};
  }
  let root = h.object; // 家具是群組，找回構件本體
  while(root && root.userData.mid === undefined) root = root.parent;
  if(!root) return null;
  const u = root.userData;
  const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
  n.set(Math.round(n.x), Math.round(n.y), Math.round(n.z));
  const A = aabbOf(u);
  if(n.y > 0){          // 頂面：往上疊
    y = A.maxY; cx = snap(h.point.x); cz = snap(h.point.z);
  }else if(n.y < 0){    // 底面：不可放
    return {hit:root, place:null};
  }else{                // 側面：貼著接續，同一個基準高度
    y = u.y;
    if(n.x){ cx = snap(n.x>0 ? A.maxX+hx : A.minX-hx); cz = snap(h.point.z); }
    else   { cz = snap(n.z>0 ? A.maxZ+hz : A.minZ-hz); cx = snap(h.point.x); }
  }
  return {hit:root, place:{cx,cz,y:Math.round(y*20)/20}};
}
function validPlace(p){
  const T = ITEMS[sel], {hx,hz} = dimsOf(sel, rot);
  if(Math.abs(p.cx)+hx > RANGE || Math.abs(p.cz)+hz > RANGE) return false;
  if(p.y < 0 || p.y + T.h > MAX_Y) return false;
  const g = {minX:p.cx-hx, maxX:p.cx+hx, minY:p.y+.02, maxY:p.y+T.h-.02, minZ:p.cz-hz, maxZ:p.cz+hz};
  for(const m of blocks.values())
    if(overlapVol(g, aabbOf(m.userData)) > .5) return false; // 允許牆角等薄交疊
  const c = camera.position; // 不能蓋在自己身上
  if(c.x>g.minX-.4 && c.x<g.maxX+.4 && c.y>g.minY-.2 && c.y<g.maxY+1.7 && c.z>g.minZ-.4 && c.z<g.maxZ+.4) return false;
  return true;
}
function placeBlock(){
  if(S.over) return;
  const t = targetPlace();
  if(!t || !t.place || !validPlace(t.place)) return;
  const T = ITEMS[sel];
  if(S.mode !== "free"){
    if(S.budget < T.cost){ pushLog("event", `預算不足，「${T.name}」要 ${W(T.cost)}。`); renderHUD(); return; }
    S.budget -= T.cost;
  }
  addMod(sel, t.place.cx, t.place.y, t.place.cz, rot);
  renderHUD(); queueSave();
}
function breakBlock(){
  if(S.over) return;
  const t = targetPlace();
  if(!t || !t.hit) return;
  const d = delMod(t.hit.userData.mid);
  if(d){ if(S.mode!=="free") S.budget += Math.floor(d.cost/2); renderHUD(); queueSave(); } // 拆除退一半
}
// ─── 切割工具：把構件沿較長邊切成兩半 ───────────────
function cutMod(mesh){
  const u = mesh.userData, I = ITEMS[u.t];
  if(I.furn){ pushLog("event", "家具無法切割。"); return; }
  const cutW = u.cw >= u.cd;
  const len = cutW ? u.cw : u.cd;
  if(len < 1.8){ pushLog("event", "構件已太小，無法再切割。"); return; }
  const ang = u.rot*Math.PI/2;
  // 局部 +x / +z 軸在世界座標的方向
  const ax = cutW ? {x:Math.cos(ang), z:-Math.sin(ang)} : {x:Math.sin(ang), z:Math.cos(ang)};
  const off = len/4, cost = u.cost, lux = u.lux;
  const dims = cutW ? {cw:len/2, ch:u.ch, cd:u.cd} : {cw:u.cw, ch:u.ch, cd:len/2};
  delMod(u.mid);
  [[1, Math.ceil(lux/2)], [-1, Math.floor(lux/2)]].forEach(([sg, lx])=>{
    addMod(u.t,
      Math.round((u.cx + ax.x*off*sg)*100)/100, u.y,
      Math.round((u.cz + ax.z*off*sg)*100)/100, u.rot, true,
      {...dims, cost:Math.round(cost/2), lux:lx});
    S.lux += lx;
  });
  pushLog("gain", `已將「${I.name}」切成兩半（各 ${(len/2).toFixed(1)}m）。`);
  renderHUD(); queueSave();
}
function cutAt(){
  if(!started || paused || S.over) return;
  const t = targetPlace();
  if(t && t.hit) cutMod(t.hit);
}

function skipMonth(){ if(started && !paused && !S.over && S.mode!=="free") advanceMonth(); }

function advanceMonth(){
  monthT = 0;
  S.month++;
  // 建設公司：出租資產每月進帳
  if(S.mode==="career" && S.rentals && S.rentals.length){
    const total = S.rentals.reduce((a,r)=>a+r.rent, 0);
    S.budget += total;
    pushLog("gain", `收到租金 ${W(total)}（${S.rentals.length} 筆出租資產）。`);
  }
  const r = Math.random();
  if(r < .30) fireDisaster();
  else if(r < .62) fireEvent();
  else pushLog("", `第 ${S.month} 月：風平浪靜，工程順利。`);
  renderHUD(); queueSave();
}

function fireDisaster(){
  // 建設公司模式：依縣市風險加權挑選天災、放大損失
  const county = S.mode==="career" && S.county!=null ? COUNTIES[S.county] : null;
  const riskOf = k => county ? ({quake:county.quake, typhoon:county.typhoon, fire:1, flood:county.flood})[k] : 1;
  let d;
  if(county){
    const ws = DISASTERS.map(x=>riskOf(x.key));
    let r2 = Math.random() * ws.reduce((a,b)=>a+b,0);
    d = DISASTERS[ws.findIndex(w => (r2 -= w) <= 0)] || DISASTERS[0];
  }else{
    d = DISASTERS[Math.floor(Math.random()*DISASTERS.length)];
  }
  const riskMult = riskOf(d.key);
  const safe = S.prot[d.key];
  const effects = [];
  let removed = 0;
  if(!safe){
    const victims = [...blocks.entries()].filter(([k,m]) => d.pick(m.userData, ITEMS[m.userData.t]));
    const n = Math.min(d.cap, Math.floor(victims.length * d.frac));
    for(let i=0;i<n;i++){
      const j = Math.floor(Math.random()*victims.length);
      const [k] = victims.splice(j,1)[0];
      if(delMod(k)) removed++;
    }
  }
  const cash = Math.round((safe ? d.lightCash : d.cash) * riskMult);
  S.budget -= cash;
  effects.push({text:`修繕費 −${W(cash)}`, good:false});
  if(removed) effects.push({text:`${removed} 件建築構件被摧毀`, good:false});
  effects.push({text:safe ? d.lightNote : d.heavyNote, good:safe});
  if(d.key==="quake") shakeT = safe ? .6 : 1.6;
  if(d.key==="typhoon" || d.key==="flood") startRain(safe ? 6 : 12);
  if(d.key==="fire" && !safe) fireFlash();
  pushLog("disaster", `${d.icon} ${d.name}！${safe ? d.lightNote : d.heavyNote}，−${W(cash)}${removed?`，損毀 ${removed} 塊`:""}。`);
  showCard({disaster:true, icon:d.icon, title:d.name, flavor:d.flavor, effects});
}
function fireEvent(){
  const e = EVENTS[Math.floor(Math.random()*EVENTS.length)];
  const cash = e.cash||0, lux = e.lux||0;
  S.budget += cash; S.lux += lux;
  const effects = [];
  if(cash) effects.push({text:`${cash>0?"+":"−"}${W(Math.abs(cash))}`, good:cash>0});
  if(lux)  effects.push({text:`豪華度 +${lux}`, good:true});
  pushLog(cash>=0 ? "gain" : "event", `${e.icon} ${e.name}：${e.flavor}`);
  showCard({disaster:false, icon:e.icon, title:e.name, flavor:e.flavor, effects});
}

  paused = true;
  document.exitPointerLock && document.exitPointerLock();
  const rows = PROTS.map(p=>{
    const owned = S.prot[p.key];
    return `<div class="shoprow ${owned?"owned":""}"><span class="ic">${p.icon}</span>` +
      `<div class="inf"><div class="n">${p.name}　<span style="color:var(--gold)">${owned?"已完工":W(p.cost)}</span></div>` +
      `<div class="d">${p.desc}</div></div>` +
      `<button data-k="${p.key}" ${owned||S.budget<p.cost?"disabled":""}>${owned?"✓":"施作"}</button></div>`;
  }).join("");

    `<div class="overlay"><div class="card"><div class="big">🛡️</div><h3>防災工程</h3>` +
    `<p style="font-size:13px;color:var(--muted)">天有不測風雲——先花小錢，才不會災後花大錢。</p>` +
    rows + `<button class="main" id="shop-close">回到工地</button></div></div>`;
  $("modal-root").querySelectorAll("button[data-k]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const p = PROTS.find(x=>x.key===b.dataset.k);
      if(S.prot[p.key] || S.budget < p.cost) return;
      S.budget -= p.cost; S.prot[p.key] = true;
      pushLog("gain", `完成「${p.name}」，−${W(p.cost)}。`);
      renderHUD(); queueSave(); openShop();
    });
  });
  $("shop-close").addEventListener("click", ()=>{
    $("modal-root").innerHTML = ""; paused = false;
    if(!IS_TOUCH) tryLock();
  });
}

// ─── 3D 模型匯出（GLB）─────────────────────────────
function exportGLB(){
  return new Promise((resolve, reject)=>{
    if(!THREE.GLTFExporter) return reject(new Error("匯出器尚未載入"));
    if(!blocks.size) return reject(new Error("沒有任何構件"));
    const group = new THREE.Group();
    group.name = "GoldenManor";
    for(const m of blocks.values()){
      const c = m.clone(); // Mesh 或家具 Group 都可
      c.name = m.userData.t.replace(".", "_") + "_" + m.userData.mid;
      group.add(c);
    }
    new THREE.GLTFExporter().parse(group, resolve, reject, {binary:true});
  });
}
// 單檔 STORE 模式 ZIP（Artifact 環境的下載白名單只收 .zip）
const CRC_T = (()=>{
  const t = new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[i]=c; }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function buildZip(name, u8){
  const nb = new TextEncoder().encode(name);
  const crc = crc32(u8);
  const lfh = 30+nb.length, cdh = 46+nb.length;
  const out = new Uint8Array(lfh + u8.length + cdh + 22);
  const dv = new DataView(out.buffer);
  let p = 0;
  dv.setUint32(p,0x04034b50,true); dv.setUint16(p+4,20,true);
  dv.setUint32(p+14,crc,true); dv.setUint32(p+18,u8.length,true); dv.setUint32(p+22,u8.length,true);
  dv.setUint16(p+26,nb.length,true);
  out.set(nb, p+30); p += lfh;
  out.set(u8, p); p += u8.length;
  const cdOff = p;
  dv.setUint32(p,0x02014b50,true); dv.setUint16(p+4,20,true); dv.setUint16(p+6,20,true);
  dv.setUint32(p+16,crc,true); dv.setUint32(p+20,u8.length,true); dv.setUint32(p+24,u8.length,true);
  dv.setUint16(p+28,nb.length,true);
  out.set(nb, p+46); p += cdh;
  dv.setUint32(p,0x06054b50,true); dv.setUint16(p+8,1,true); dv.setUint16(p+10,1,true);
  dv.setUint32(p+12,cdh,true); dv.setUint32(p+16,cdOff,true);
  return out;
}
async function download3D(btn){
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = "匯出中…";
  try{
    const glb = await exportGLB();
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if(dl){ // Artifact 環境：官方下載 API，打包成 zip
      const zip = buildZip("golden-manor.glb", new Uint8Array(glb));
      await dl.save({filename:"golden-manor-3d.zip", data:new Blob([zip])});
    }else{ // 一般網頁（GitHub Pages）：直接下載 .glb
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([glb], {type:"model/gltf-binary"}));
      a.download = "golden-manor.glb";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
    }
    btn.textContent = "已下載 ✓";
  }catch(err){
    btn.textContent = err && err.code === "declined" ? "已取消" : "匯出失敗";
  }
  setTimeout(()=>{ btn.disabled = false; btn.textContent = orig; }, 2600);
}

// ─── 存檔 ───────────────────────────────────────────
const SAVE_KEY = "golden-manor-3d-v3";
function snapshot(){
  return {...S, sel, recents, mods:[...blocks.values()].map(m=>{
    const u = m.userData, I = ITEMS[u.t];
    return (u.cw!==I.w || u.ch!==I.h || u.cd!==I.d)
      ? [u.t, u.cx, u.y, u.cz, u.rot, u.cw, u.ch, u.cd, u.cost, u.lux]
      : [u.t, u.cx, u.y, u.cz, u.rot];
  })};
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    const snap = snapshot();
    try{ window.claude?.hot?.snapshot?.(snap); }catch(e){}
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(snap)); }catch(e){}
  }, 400);
}
function restore(data){
  S = freshS();
  for(const k of Object.keys(S)) if(k in data && k!=="prot") S[k]=data[k];
  if(data.prot) S.prot = {...S.prot, ...data.prot};
  for(const e of data.mods||[]){
    const opts = e.length > 5 ? {cw:e[5], ch:e[6], cd:e[7], cost:e[8], lux:e[9]} : undefined;
    addMod(e[0], e[1], e[2], e[3], e[4]||0, true, opts);
  }
  if(Array.isArray(data.recents)){
    const valid = data.recents.filter(id=>ITEMS[id]);
    if(valid.length) recents = valid.slice(0,10);
  }
  if(ITEMS[data.sel]) sel = data.sel;
}

// ─── 建設公司：土地競標與出售 ───────────────────────
let plots = null, bidState = null;
function genPlots(){
  const idx = COUNTIES.map((c,i)=>i).sort(()=>Math.random()-.5).slice(0,3);
  return idx.map(i=>({ci:i, base: Math.round(COUNTIES[i].price*800*R(.85,1.2)/10)*10}));
}
function plotRow(p, j){
  const c = COUNTIES[p.ci];
  const afford = S.budget >= p.base;
  return `<div class="shoprow" style="cursor:${afford?"pointer":"default"};opacity:${afford?1:.45}" data-j="${j}">` +
    `<span class="ic">${{plain:"🌾",hill:"⛰️",mount:"🏔️",coast:"🌊"}[c.terrain]}</span>` +
    `<div class="inf"><div class="n">${c.name}　<span style="color:var(--gold)">底價 ${W(p.base)}</span></div>` +
    `<div class="d">${TERRAIN_NAME[c.terrain]}｜地價 ${c.price}/10｜震 ${riskLabel(c.quake)}・颱 ${riskLabel(c.typhoon)}・洪 ${riskLabel(c.flood)}｜${c.info}</div></div></div>`;
}
function openBidding(){
  paused = true;
  document.exitPointerLock && document.exitPointerLock();
  if(!plots) plots = genPlots();
  if(S.budget < Math.min(...plots.map(p=>p.base)) && blocks.size === 0 && !(S.rentals && S.rentals.length)){
    endGame("💸", "公司倒閉", "資金不足以競標任何土地，也沒有資產可變現，建設公司黯然熄燈。");

  }
  const portfolio = (S.rentals && S.rentals.length)
    ? `<div class="catfam">── 出租中資產（每月收租）──</div>` +
      S.rentals.map((r2,j)=>{
        const c = COUNTIES[r2.ci], resale = Math.round(saleValue(r2.lux, c)*.9);
        return `<div class="shoprow"><span class="ic">🏠</span>` +
          `<div class="inf"><div class="n">${c.name}物業　<span style="color:var(--good)">月租 ${W(r2.rent)}</span></div>` +
          `<div class="d">豪華度 ${r2.lux}｜轉售價 ${W(resale)}（九折屋齡折舊）</div></div>` +
          `<button data-r="${j}">售出</button></div>`;
      }).join("")
    : "";
  $("modal-root").innerHTML =
    `<div class="overlay"><div class="card catalog" style="max-width:560px">` +
    `<h3>土地競標<span class="catcount">資金 ${W(S.budget)}</span></h3>` +

    plots.map((p,j)=>plotRow(p,j)).join("") +
    portfolio +

    el.addEventListener("click", ()=>{
      const p = plots[+el.dataset.j];
      if(S.budget >= p.base) startBid(p);
    }));
  $("modal-root").querySelectorAll("button[data-r]").forEach(b=>
    b.addEventListener("click", e=>{
      e.stopPropagation();
      const j = +b.dataset.r, r2 = S.rentals[j], c = COUNTIES[r2.ci];
      const resale = Math.round(saleValue(r2.lux, c)*.9);
      S.budget += resale;
      S.rentals.splice(j,1);
      pushLog("gain", `售出${c.name}出租物業，入帳 ${W(resale)}。`);
      queueSave(); renderHUD(); openBidding();
    }));
  $("bid-refresh").addEventListener("click", ()=>{ plots = genPlots(); openBidding(); });
}
function startBid(p){
  bidState = {p, price:p.base, leader:null,
    ais:[{name:"寶島建設", cap:Math.round(p.base*R(1.12,1.9)), out:false},
         {name:"大山開發", cap:Math.round(p.base*R(1.05,1.6)), out:false}],
    log:[`起標：底價 ${W(p.base)}`]};
  renderBid();
}
function renderBid(){
  const b = bidState, c = COUNTIES[b.p.ci];
  const youLead = b.leader === "你";
  const canRaise = S.budget >= (b.leader===null ? b.price : Math.ceil(b.price*1.05));
  $("modal-root").innerHTML =
    `<div class="overlay"><div class="card" style="max-width:460px">` +
    `<div class="big">🔨</div><h3>${c.name}・土地競標</h3>` +
    `<p style="font-size:20px;font-variant-numeric:tabular-nums">目前 <b style="color:var(--gold)">${W(b.price)}</b>` +
    `${b.leader ? `　<span style="font-size:13px;color:${youLead?"var(--good)":"var(--bad)"}">${b.leader}領先</span>` : ""}</p>` +
    `<div style="max-height:130px;overflow-y:auto;text-align:left;font-size:12px;color:var(--muted);background:#20242e;border-radius:8px;padding:8px 12px">` +
    b.log.map(l=>`<div>${l}</div>`).join("") + `</div>` +
    `<div style="display:flex;gap:10px;justify-content:center;margin-top:14px">` +
    `<button class="main" id="bid-raise" ${youLead||!canRaise?"disabled":""} style="${youLead||!canRaise?"opacity:.4":""}">` +
    (b.leader===null ? `出價 ${W(b.price)}` : `加價至 ${W(Math.ceil(b.price*1.05))}`) + `</button>` +
    `<button class="alt" id="bid-quit" style="margin-top:0">${youLead?"等待底定":"放棄"}</button></div>` +
    (!canRaise && !youLead ? `<p style="font-size:12px;color:var(--bad);margin-top:8px">資金不足，無法再加價</p>` : "") +
    `</div></div>`;
  $("bid-raise").addEventListener("click", playerBid);
  $("bid-quit").addEventListener("click", ()=>{
    if(bidState.leader === "你"){ winBid(); return; } // 你領先時按下即結標
    pushLog("event", `放棄競標${c.name}土地。`);
    bidState = null; openBidding();
  });
}
function playerBid(){
  const b = bidState;
  b.price = b.leader === null ? b.price : Math.ceil(b.price*1.05/10)*10;
  b.leader = "你";
  b.log.unshift(`你出價 ${W(b.price)}`);
  // AI 回應
  const alive = b.ais.filter(a=>!a.out);
  for(const a of alive){ if(a.cap <= b.price){ a.out = true; b.log.unshift(`${a.name} 退出競標`); } }
  const bidders = b.ais.filter(a=>!a.out);
  if(bidders.length){
    const a = bidders[Math.floor(Math.random()*bidders.length)];
    b.price = Math.min(a.cap, Math.ceil(b.price*R(1.05,1.12)/10)*10);
    b.leader = a.name;
    b.log.unshift(`${a.name} 出價 ${W(b.price)}`);
    renderBid();
  }else{
    winBid();
  }
}
function winBid(){
  const b = bidState, c = COUNTIES[b.p.ci];
  S.budget -= b.price;
  S.county = b.p.ci;
  S.projStart = S.month;
  S.prot = {quake:false, typhoon:false, fire:false, flood:false};
  clearWorld(); S.lux = 0;
  applyTerrain(S.county);
  bidState = null; plots = null;
  pushLog("gain", `以 ${W(b.price)} 得標${c.name}土地（${TERRAIN_NAME[c.terrain]}）！開始蓋屋吧。`);
  $("modal-root").innerHTML = "";
  paused = false;
  renderHUD(); queueSave();
  enterWorld();
}
const MIN_BUILD_MONTHS = 12; // 工期須「超過」12 個月才能結案
function saleValue(lux, c){ return Math.round(lux * (8 + c.price*2.2)); }
function finishProject(kind){ // "sale" | "rent"
  const c = COUNTIES[S.county];
  const sale = saleValue(S.lux, c);
  if(kind === "sale"){
    S.budget += sale;
    pushLog("gain", `${c.name}建案以 ${W(sale)} 售出！（第 ${S.projects+1} 個完工案）`);
  }else{
    const rent = Math.max(1, Math.round(sale/45));
    S.rentals.push({ci:S.county, lux:S.lux, rent});
    pushLog("gain", `${c.name}建案開始出租，月租金 ${W(rent)}。資產交由物業管理。`);
  }
  S.projects++;
  clearWorld(); S.lux = 0; S.county = null;
  applyTerrain(null);
  renderHUD(); queueSave();
  openBidding();
}
function sellProject(){
  if(S.mode !== "career" || S.over || paused) return;
  if(S.county == null){ openBidding(); return; }
  if(S.lux <= 0){ pushLog("event", "還沒有任何建設，無法結案。"); return; }
  const c = COUNTIES[S.county];
  const dur = S.month - S.projStart;
  paused = true;
  document.exitPointerLock && document.exitPointerLock();
  if(dur <= MIN_BUILD_MONTHS){
    $("modal-root").innerHTML =
      `<div class="overlay"><div class="card"><div class="big">🚧</div><h3>工程尚未完工</h3>` +
      `<p>${c.name}建案目前工期 ${dur} 個月。</p>` +
      `<p style="font-size:13px;color:var(--muted)">依法工期須超過 ${MIN_BUILD_MONTHS} 個月才能申請使照——還差 ${MIN_BUILD_MONTHS+1-dur} 個月（可按 N 跳月趕工）。</p>` +
      `<button class="main" id="sell-no">回到工地</button></div></div>`;
    $("sell-no").addEventListener("click", ()=>{
      $("modal-root").innerHTML = ""; paused = false;
      if(!IS_TOUCH) tryLock();
    });
    return;
  }
  const sale = saleValue(S.lux, c);
  const rent = Math.max(1, Math.round(sale/45));
  $("modal-root").innerHTML =
    `<div class="overlay"><div class="card"><div class="big">🏷️</div><h3>建案結算</h3>` +
    `<p>${c.name}建案　工期 ${dur} 個月　豪華度 ${S.lux}</p>` +
    `<div class="effect good">出售：一次入帳 ${W(sale)}</div>` +
    `<div class="effect good">出租：每月收租 ${W(rent)}，資產保留日後可售</div>` +
    `<div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap">` +
    `<button class="main" id="sell-ok" style="margin-top:0">立即出售</button>` +
    `<button class="main" id="rent-ok" style="margin-top:0;background:var(--good)">出租</button>` +
    `<button class="alt" id="sell-no" style="margin-top:0">再想想</button></div></div></div>`;
  $("sell-ok").addEventListener("click", ()=>finishProject("sale"));
  $("rent-ok").addEventListener("click", ()=>finishProject("rent"));
  $("sell-no").addEventListener("click", ()=>{
    $("modal-root").innerHTML = ""; paused = false;
    if(!IS_TOUCH) tryLock();
  });
}
$("btn-sell").addEventListener("click", e=>{ e.currentTarget.blur(); sellProject(); });
$("btn-dl").addEventListener("click", e=>{ e.currentTarget.blur(); download3D(e.target); });

// ─── 主迴圈 ─────────────────────────────────────────
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .1);

  if(started && !paused && !S.over){
    // 移動（飛行）
    const sp = 8*dt;
    const f = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const r = new THREE.Vector3(-f.z,0,f.x); // 右向量 = forward × up
    let mx=0,mz=0,my=0;
    if(keys.KeyW) mz+=1; if(keys.KeyS) mz-=1;
    if(keys.KeyD) mx+=1; if(keys.KeyA) mx-=1;
    if(keys.Space) my+=1; if(keys.ShiftLeft||keys.ShiftRight) my-=1;
    mz -= joyV.y; mx += joyV.x; my += flyUp;
    camera.position.addScaledVector(f, mz*sp).addScaledVector(r, mx*sp);
    camera.position.y = Math.max(1.2, Math.min(MAX_Y+6, camera.position.y + my*sp));

    // 月份計時（自由建造模式時間暫停）
    if(S.mode !== "free"){
      monthT += dt;
      $("monthfill").style.width = Math.min(100, monthT/MONTH_SECS*100)+"%";
      if(monthT >= MONTH_SECS) advanceMonth();
    }

    // 預覽鬼影（金色＝可放，紅色＝不可）
    const t = targetPlace();
    if(t && t.place){
      const T = ITEMS[sel], {hx,hz} = dimsOf(sel, rot);
      ghost.scale.set(hx*2, T.h, hz*2);
      ghost.position.set(t.place.cx, t.place.y+T.h/2, t.place.cz);
      ghost.material.color.set(validPlace(t.place) ? 0xc9a35c : 0xd9564a);
      ghost.visible = true;
    }else ghost.visible = false;
  }else ghost.visible = false;

  // 環境動態：池水流動、雲飄、雨落
  for(const wt of waterTexes){ wt.offset.y += dt*.028; wt.offset.x += dt*.011; }
  for(const c of clouds){ c.position.x += dt*.7; if(c.position.x > 150) c.position.x = -150; }
  if(weatherT > 0){
    weatherT -= dt;
    const arr = rainGeo.attributes.position.array;
    for(let i=0;i<RAIN_N;i++){
      arr[i*3+1] -= 26*dt;
      arr[i*3]   += 4*dt;
      if(arr[i*3+1] < 0){ arr[i*3+1] = 36; arr[i*3] = R(-38,38); arr[i*3+2] = R(-38,38); }
    }
    rainGeo.attributes.position.needsUpdate = true;
    if(weatherT <= 0) rain.visible = false;
  }

  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  if(shakeT > 0){
    shakeT -= dt;
    camera.position.x += (Math.random()-.5)*.14;
    camera.position.y += (Math.random()-.5)*.14;
  }
  renderer.render(scene, camera);
}
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── 啟動 ───────────────────────────────────────────
function boot(data){
  blocks = new Map();
  if(IS_TOUCH){
    $("btn-cat").textContent = "建材目錄";
    $("btn-shop").textContent = "防災工程";
    $("btn-skip").textContent = "跳到下個月";
  }
  if(!data){
    try{ data = JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ data = null; }
  }
  if(data && data.mods && !data.over && data.mode !== "classic"){
    restore(data);
    canResume = true;
    if(S.county != null) applyTerrain(S.county);
  }else{
    S = freshS();
  }
  applyMode(); renderHUD(); renderHotbar(); showStart(); tick();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? null);
</script>
